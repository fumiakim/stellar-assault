<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STELLAR ASSAULT ─ 縦スクロールシューティング</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    width:100%; height:100%; background:#05060c; overflow:hidden;
    font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
    color:#8fa;
  }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #cv {
    display:block;
    background:#000;
    image-rendering:pixelated;
    box-shadow:0 0 40px rgba(60,140,255,.35), 0 0 0 2px #1a2740;
    transform-origin:center center;
  }
  #hint {
    position:fixed; left:8px; bottom:6px; font-size:11px; color:#3a4a66;
    letter-spacing:.04em; pointer-events:none; user-select:none;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="480" height="640"></canvas></div>
<div id="hint">1P: WASD 移動 / Space ショット / Q・左Shift ボム（ゲームパッド対応）　　2P: 矢印キー 移動 / Enter・テンキー0 ショット / ／・右Shift ボム　　P 一時停止 / M 音量</div>
<script>
'use strict';
(function () {

/* ============================================================
   0. 基本設定・ユーティリティ
   ============================================================ */
const W = 480, H = 640;
const TAU = Math.PI * 2;
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d', { alpha:false });

const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const rand  = (a,b) => a + Math.random()*(b-a);
const rint  = (a,b) => Math.floor(a + Math.random()*(b-a+1));
const pick  = arr => arr[Math.floor(Math.random()*arr.length)];
const hyp   = (x,y) => Math.sqrt(x*x+y*y);
function angDiff(a,b){ let d=(b-a)%TAU; if(d> Math.PI) d-=TAU; if(d<-Math.PI) d+=TAU; return d; }
// 点 → 半直線 の距離（レーザー判定用）
function distToRay(px,py,x,y,ang,len){
  const dx=Math.cos(ang), dy=Math.sin(ang);
  let t=(px-x)*dx+(py-y)*dy; t=clamp(t,0,len);
  return hyp(px-(x+dx*t), py-(y+dy*t));
}

// 画面サイズに合わせて拡大
function fit(){
  const s = Math.min(window.innerWidth/W, window.innerHeight/H);
  cv.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit); fit();

/* ============================================================
   1. 入力
   ============================================================ */
const P1KEY = {
  up:['KeyW'], down:['KeyS'], left:['KeyA'], right:['KeyD'],
  shot:['Space'], bomb:['KeyQ','ShiftLeft']
};
const P2KEY = {
  up:['ArrowUp'], down:['ArrowDown'], left:['ArrowLeft'], right:['ArrowRight'],
  shot:['Enter','Numpad0','NumpadEnter'], bomb:['Slash','ShiftRight','NumpadDecimal']
};
const BLOCK = new Set([
  'Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Slash','Enter',
  'Numpad0','NumpadDecimal','KeyW','KeyA','KeyS','KeyD','KeyQ','Tab'
]);

const held = new Set();
const edge = new Set();      // このフレームで押された
let anyKeyThisFrame = false;

window.addEventListener('keydown', e => {
  if (BLOCK.has(e.code)) e.preventDefault();
  if (!e.repeat) { edge.add(e.code); anyKeyThisFrame = true; }
  held.add(e.code);
  initAudio();
});
window.addEventListener('keyup',  e => { held.delete(e.code); });
window.addEventListener('blur',   () => { held.clear(); if (state==='play') paused = true; });

const down = list => list.some(k => held.has(k));
const hit  = list => list.some(k => edge.has(k));

/* --- ゲームパッド（1P用） -------------------------------------------------
   標準マッピング（Xbox / PS / Switch Pro など）を想定。
   ショット: A・X・R1・R2 ／ ボム: B・Y・L1・L2 ／ 一時停止: START
   移動: 左スティック（アナログ）＋ 十字キー                                */
const PAD_SHOT  = [0,2,5,7];
const PAD_BOMB  = [1,3,4,6];
const PAD_START = [9];
const DEADZONE  = 0.24;

const Pad = {
  on:false, name:'', btn:[], prev:[], ax:[0,0],
  nav:{x:0,y:0}, navPrev:{x:0,y:0},
  poll(){
    const list = navigator.getGamepads ? navigator.getGamepads() : null;
    let gp = null;
    if (list) for (let i=0;i<list.length;i++){
      const g = list[i];
      if (g && g.connected && g.buttons && g.buttons.length){ gp = g; break; }
    }
    this.prev = this.btn;
    this.navPrev = this.nav;
    if (!gp){ this.on=false; this.name=''; this.btn=[]; this.ax=[0,0]; this.nav={x:0,y:0}; return; }
    this.on = true; this.name = gp.id;
    this.btn = gp.buttons.map(b => b.pressed || b.value > 0.4);
    this.ax  = [gp.axes[0]||0, gp.axes[1]||0];
    // メニュー用に方向をデジタル化（十字キーとスティックの両方）
    let nx = this.ax[0], ny = this.ax[1];
    if (this.btn[14]) nx = -1; if (this.btn[15]) nx = 1;
    if (this.btn[12]) ny = -1; if (this.btn[13]) ny = 1;
    this.nav = { x: nx>0.55?1:(nx<-0.55?-1:0), y: ny>0.55?1:(ny<-0.55?-1:0) };
    // パッドのボタンが押されたらサウンドの初期化も試みる
    if (this.btn.some((b,i) => b && !this.prev[i])) initAudio();
  },
  down(list){ return this.on && list.some(i => this.btn[i]); },
  hit(list){  return this.on && list.some(i => this.btn[i] && !this.prev[i]); },
  anyHit(){   return this.on && this.btn.some((b,i) => b && !this.prev[i]); },
  // 移動ベクトル（デッドゾーン処理つき）
  move(){
    if (!this.on) return {x:0,y:0};
    let x = this.ax[0], y = this.ax[1];
    const d = Math.hypot(x,y);
    if (d < DEADZONE) { x = 0; y = 0; }
    else { const k = Math.min(1,(d-DEADZONE)/(0.95-DEADZONE))/d; x*=k; y*=k; }
    if (this.btn[14]) x = -1; if (this.btn[15]) x = 1;
    if (this.btn[12]) y = -1; if (this.btn[13]) y = 1;
    return {x,y};
  },
  navUp(){    return this.nav.y===-1 && this.navPrev.y!==-1; },
  navDown(){  return this.nav.y=== 1 && this.navPrev.y!== 1; },
  navLeft(){  return this.nav.x===-1 && this.navPrev.x!==-1; },
  navRight(){ return this.nav.x=== 1 && this.navPrev.x!== 1; }
};
window.addEventListener('gamepadconnected', () => initAudio());

const anyHit = () => edge.size > 0 || Pad.anyHit();
// 1P はキーボードとゲームパッドのどちらでも操作できる
const pDown = (p, act) => down(playerKeys(p)[act]) ||
  (p.id===0 && (act==='shot' ? Pad.down(PAD_SHOT) : false));
const pHit  = (p, act) => hit(playerKeys(p)[act]) ||
  (p.id===0 && (act==='shot' ? Pad.hit(PAD_SHOT) : act==='bomb' ? Pad.hit(PAD_BOMB) : false));

/* ============================================================
   2. サウンド（WebAudio 合成・外部ファイル不要）
   ============================================================ */
let actx = null, masterGain = null, sfxGain = null, bgmGain = null, noiseBuf = null;
let soundOn = true;

function initAudio(){
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    masterGain = actx.createGain(); masterGain.gain.value = 0.7; masterGain.connect(actx.destination);
    sfxGain = actx.createGain(); sfxGain.gain.value = 0.55; sfxGain.connect(masterGain);
    bgmGain = actx.createGain(); bgmGain.gain.value = 0.30; bgmGain.connect(masterGain);
    const n = actx.sampleRate * 1.0;
    noiseBuf = actx.createBuffer(1, n, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = Math.random()*2-1;
  } catch(e){ actx = null; }
}
function setSound(on){
  soundOn = on;
  if (masterGain) masterGain.gain.value = on ? 0.7 : 0.0;
}
function tone(freq, dur, type, vol, slideTo){
  if (!actx || !soundOn) return;
  const t0 = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0+dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(0.01, dur*0.2));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(sfxGain);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noiseHit(dur, vol, f0, f1, q){
  if (!actx || !soundOn || !noiseBuf) return;
  const t0 = actx.currentTime;
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const bp = actx.createBiquadFilter(); bp.type='lowpass';
  bp.frequency.setValueAtTime(f0, t0);
  bp.frequency.exponentialRampToValueAtTime(Math.max(40,f1), t0+dur);
  bp.Q.value = q || 1;
  const g = actx.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  s.connect(bp); bp.connect(g); g.connect(sfxGain);
  s.start(t0); s.stop(t0+dur+0.02);
}
let sfxShotCd = 0;
const SFX = {
  shot(){ if (sfxShotCd>0) return; sfxShotCd = 3; tone(1400, 0.05, 'square', 0.05, 700); },
  eshot(){ tone(300, 0.06, 'sawtooth', 0.025, 190); },
  hit(){ noiseHit(0.04, 0.06, 3800, 900); },
  pop(){ noiseHit(0.18, 0.16, 2200, 200); tone(240,0.14,'square',0.05,80); },
  big(){ noiseHit(0.55, 0.30, 1500, 60, 0.7); tone(150,0.4,'sawtooth',0.10,40); },
  huge(){ noiseHit(1.1, 0.40, 1100, 40, 0.8); tone(90,0.9,'sawtooth',0.14,30); },
  power(){ [0,1,2,3].forEach(i => setTimeout(()=>tone(660*Math.pow(2,i/6), 0.10,'square',0.09), i*45)); },
  bombitem(){ [0,1,2].forEach(i => setTimeout(()=>tone(440*Math.pow(2,i/4), 0.12,'triangle',0.10), i*55)); },
  extend(){ [0,2,4,7,12].forEach((n,i)=> setTimeout(()=>tone(523.25*Math.pow(2,n/12),0.14,'square',0.10), i*70)); },
  bomb(){ noiseHit(0.9, 0.35, 4000, 80, 0.9); tone(500,0.7,'sawtooth',0.12,60); },
  death(){ noiseHit(0.7, 0.28, 2000, 50); tone(400,0.6,'sawtooth',0.12,50); },
  warn(){ tone(880,0.18,'square',0.10); setTimeout(()=>tone(660,0.22,'square',0.10),200); },
  menu(){ tone(880, 0.05,'square',0.07); },
  ok(){ tone(660,0.07,'square',0.09); setTimeout(()=>tone(990,0.11,'square',0.09),70); },
  laser(){ tone(180,0.5,'sawtooth',0.06,900); }
};

/* --- BGM：簡易ステップシーケンサ --- */
const TRACKS = {
  title : {bpm:126, chords:[[57,60,64],[53,57,60],[55,59,62],[57,60,64]], lead:[0,-1,2,-1,4,-1,2,3, 1,-1,3,-1,5,-1,-1,-1], drum:0},
  st1   : {bpm:156, chords:[[57,60,64],[52,55,59],[53,57,60],[55,59,62]], lead:[3,-1,2,3,4,-1,3,2, 1,-1,2,4,5,-1,4,3], drum:1},
  st2   : {bpm:148, chords:[[50,53,57],[48,52,55],[55,58,62],[53,57,60]], lead:[0,1,2,3,4,3,2,1, 2,3,4,5,4,3,2,1], drum:1},
  st3   : {bpm:166, chords:[[45,48,52],[50,53,57],[47,50,54],[52,55,59]], lead:[5,-1,4,-1,3,4,5,-1, 2,-1,3,4,5,4,3,2], drum:2},
  st4   : {bpm:158, chords:[[52,55,59],[50,53,57],[48,52,55],[47,50,54]], lead:[0,3,2,4,3,5,4,-1, 5,3,4,2,3,1,2,-1], drum:1},
  st5   : {bpm:174, chords:[[45,48,52],[46,49,53],[48,51,55],[50,53,57]], lead:[5,4,3,4,5,-1,4,5, 3,2,3,4,5,4,3,-1], drum:2},
  boss  : {bpm:172, chords:[[45,48,51],[46,49,52],[45,48,51],[44,47,50]], lead:[0,0,3,0,4,3,0,-1, 0,0,3,5,4,3,2,-1], drum:2},
  last  : {bpm:182, chords:[[43,46,50],[44,47,51],[45,48,52],[46,49,53]], lead:[5,4,5,3,4,2,3,1, 2,3,4,5,4,5,4,3], drum:2},
  ending: {bpm:104, chords:[[53,57,60],[55,59,62],[57,60,64],[52,55,59]], lead:[3,-1,4,-1,5,-1,4,3, 2,-1,3,-1,4,-1,-1,-1], drum:0}
};
const BASSPAT = [1,0,0,1,0,0,1,0, 1,0,0,1,0,1,0,0];
const mid2f = m => 440 * Math.pow(2, (m-69)/12);

const Bgm = {
  name:null, step:0, next:0,
  play(n){ if (this.name===n) return; this.name=n; this.step=0; if(actx) this.next = actx.currentTime + 0.05; },
  stop(){ this.name=null; },
  update(){
    if (!actx || !this.name || !soundOn) return;
    const tr = TRACKS[this.name]; if (!tr) return;
    const spb = 60/tr.bpm/4;
    if (this.next < actx.currentTime) this.next = actx.currentTime + 0.02;
    let guard = 0;
    while (this.next < actx.currentTime + 0.15 && guard++ < 64) {
      this.tick(tr, this.step, this.next);
      this.step = (this.step + 1) % (16 * tr.chords.length);
      this.next += spb;
    }
  },
  tick(tr, step, t){
    const bar = Math.floor(step/16) % tr.chords.length;
    const s = step % 16;
    const ch = tr.chords[bar];
    const ext = [ch[0], ch[1], ch[2], ch[0]+12, ch[1]+12, ch[2]+12];
    // ベース
    if (BASSPAT[s]) this.note(mid2f(ch[0]-12), t, 0.13, 'square', 0.16);
    // リード
    const li = tr.lead[s];
    if (li >= 0) this.note(mid2f(ext[li]+12), t, 0.15, 'square', 0.085);
    // ハーモニー（拍頭）
    if (s % 8 === 0) this.note(mid2f(ch[1]), t, 0.30, 'triangle', 0.06);
    // ドラム
    if (tr.drum > 0) {
      if (s===0 || s===6 || s===8 || (tr.drum>1 && s===11)) this.drum(t, 'k');
      if (s===4 || s===12) this.drum(t, 's');
      if (tr.drum>1 && s%2===0) this.drum(t, 'h');
    }
  },
  note(f, t, dur, type, vol){
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(bgmGain); o.start(t); o.stop(t+dur+0.02);
  },
  drum(t, kind){
    if (kind === 'k') {
      const o=actx.createOscillator(), g=actx.createGain();
      o.type='sine'; o.frequency.setValueAtTime(150,t);
      o.frequency.exponentialRampToValueAtTime(45,t+0.11);
      g.gain.setValueAtTime(0.30,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.13);
      o.connect(g); g.connect(bgmGain); o.start(t); o.stop(t+0.15);
    } else {
      const s=actx.createBufferSource(); s.buffer=noiseBuf;
      const f=actx.createBiquadFilter();
      f.type = kind==='s' ? 'bandpass' : 'highpass';
      f.frequency.value = kind==='s' ? 1800 : 7000;
      const g=actx.createGain();
      const v = kind==='s' ? 0.16 : 0.045, d = kind==='s' ? 0.13 : 0.035;
      g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      s.connect(f); f.connect(g); g.connect(bgmGain); s.start(t); s.stop(t+d+0.02);
    }
  }
};

/* ============================================================
   3. エフェクト（パーティクル・画面揺れ）
   ============================================================ */
let particles = [];
let shake = 0, flash = 0, flashCol = '#fff';

function spark(x,y,n,col,spd,life,size){
  for (let i=0;i<n;i++){
    if (particles.length > 900) break;
    const a = rand(0,TAU), s = rand(spd*0.25, spd);
    particles.push({x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
      life:rand(life*0.5,life), max:life, col, size:size||2.4, drag:0.94, glow:true});
  }
}
function boom(x,y,scale,col){
  scale = scale || 1;
  spark(x,y, Math.min(40, 10+12*scale), col||'#ffd27a', 3.2*scale, 26*scale, 2.6*scale);
  spark(x,y, Math.min(24, 6+8*scale), '#fff', 2.0*scale, 16*scale, 1.8*scale);
  particles.push({x,y, vx:0,vy:0, life:14*Math.min(2,scale), max:14*Math.min(2,scale),
    col:'#fff', size:10*scale, drag:1, ring:true});
  shake = Math.min(18, shake + 2.5*scale);
}
function updateParticles(){
  for (let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    if (p.drag !== 1){ p.vx *= p.drag; p.vy *= p.drag; }
    p.life--;
    if (p.life <= 0) particles.splice(i,1);
  }
  if (shake > 0) shake = Math.max(0, shake - 0.6);
  if (flash > 0) flash = Math.max(0, flash - 0.06);
}
function drawParticles(){
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles){
    const k = p.life / p.max;
    ctx.globalAlpha = clamp(k,0,1);
    if (p.ring){
      ctx.strokeStyle = p.col; ctx.lineWidth = 3*k;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size*(1.6-k)*2.0, 0, TAU); ctx.stroke();
    } else {
      ctx.fillStyle = p.col;
      const s = p.size*k;
      ctx.fillRect(p.x-s/2, p.y-s/2, s, s);
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* ============================================================
   4. 弾・アイテム
   ============================================================ */
let pshots = [], eshots = [], items = [], beams = [];

// --- 自機弾 ---
function pshot(owner,x,y,vx,vy,dmg,type){
  if (pshots.length > 420) return;
  pshots.push({owner,x,y,vx,vy,dmg,type:type||'n',r:5,t:0,homeT:0});
}
// --- 敵弾 ---
function eshot(x,y,vx,vy,o){
  if (eshots.length > 1100) return;
  o = o || {};
  eshots.push({x,y,vx,vy, r:(o.r||5.5)*0.9, col:o.col||'#ff5ae0', core:o.core||'#fff',
    type:o.type||'ball', homing:o.homing||0, t:0, acc:o.acc||0, grz:false});
}
function eshotA(x,y,ang,sp,o){ eshot(x,y,Math.cos(ang)*sp,Math.sin(ang)*sp,o); }
function aimAng(x,y){
  const p = nearestPlayer(x,y);
  return p ? Math.atan2(p.y-y, p.x-x) : Math.PI/2;
}
// --- 弾密度の調整（面ごと。dens が小さいほど「弾が少なく・間隔が長い」）---
// fireAt: 発射間隔を dens で伸縮させる。cdens: 一度に撒く弾数を減らす。
function fireAt(t, period, off){
  const p = Math.max(1, Math.round(period / dens));
  return t % p === off % p;
}
function fan(x,y,ang,n,spread,sp,o){
  const m = Math.max(1, Math.round(n * cdens));
  const total = spread * (n-1);          // 弾数を減らしても扇の広がりは保つ
  const s = m > 1 ? total/(m-1) : 0;
  for (let i=0;i<m;i++) eshotA(x,y, ang + (i-(m-1)/2)*s, sp, o);
}
function ringShot(x,y,n,sp,off,o){
  const m = Math.max(5, Math.round(n * cdens));
  for (let i=0;i<m;i++) eshotA(x,y, off + i*TAU/m, sp, o);
}

// --- アイテム ---
const ITEM_COL = { P:'#ff4d6d', B:'#4dd2ff', S:'#ffd83d', U:'#7dff8a' };
function dropItem(x,y,type){
  items.push({x,y, vx:rand(-0.5,0.5), vy:-1.4, type, t:0});
}
// 撃破に依存せず上空から降ってくる補給アイテム
function supply(type,x){ items.push({x:clamp(x,20,W-20), y:-18, vx:0, vy:1.1, type, t:0}); }
function updateItems(){
  for (let i=items.length-1;i>=0;i--){
    const it = items[i];
    it.t++;
    it.vy = Math.min(1.5, it.vy + 0.045);
    it.x += it.vx; it.y += it.vy;
    if (it.x < 12) { it.x = 12; it.vx = Math.abs(it.vx); }
    if (it.x > W-12){ it.x = W-12; it.vx = -Math.abs(it.vx); }
    if (it.y > H + 24){ items.splice(i,1); continue; }
    for (const p of players){
      if (!p.playing) continue;
      // 吸い寄せ
      const dx = p.x-it.x, dy = p.y-it.y, d = hyp(dx,dy);
      if (d < 90){ it.x += dx/d*1.6; it.y += dy/d*1.6; }
      if (d < 22){ takeItem(p, it.type); items.splice(i,1); break; }
    }
  }
}
function takeItem(p, type){
  if (type === 'P'){
    if (p.power < MAX_POWER){ p.power++; SFX.power(); p.msg='POWER UP!'; p.msgT=70; }
    else { p.score += 3000; SFX.power(); }
  } else if (type === 'B'){
    if (p.bombs < 6){ p.bombs++; SFX.bombitem(); p.msg='BOMB +1'; p.msgT=70; }
    else p.score += 3000;
  } else if (type === 'S'){
    p.score += 500;
    tone(1200,0.04,'square',0.04,1600);
  } else if (type === 'U'){
    p.lives++; SFX.extend(); p.msg='1UP!'; p.msgT=100;
  }
}
function drawItems(){
  for (const it of items){
    const c = ITEM_COL[it.type];
    const b = 0.6 + 0.4*Math.sin(it.t*0.18);
    ctx.save(); ctx.translate(it.x, it.y);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#101822'; ctx.strokeStyle = c; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.rect(-9,-9,18,18); ctx.fill(); ctx.stroke();
    ctx.globalAlpha = b;
    ctx.fillStyle = c;
    ctx.font = 'bold 13px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(it.type==='U'?'1':it.type, 0, 1);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* ============================================================
   5. 自機
   ============================================================ */
function makePlayer(id){
  return {
    id, playing:false, alive:false,
    x: id===0 ? W/2-60 : W/2+60, y: H-90,
    lives:3, bombs:3, power:0, score:0, credits:0,
    inv:0, respawn:0, outWait:0, fireCd:0, missileCd:0,
    bombT:0, msg:'', msgT:0, t:0, hitR:3.2,
    col: id===0 ? '#5fd8ff' : '#ffb15f',
    col2: id===0 ? '#1b6bff' : '#ff6a1b'
  };
}
let players = [makePlayer(0), makePlayer(1)];

function joinPlayer(p, firstTime){
  p.playing = true; p.alive = true;
  p.lives = firstTime ? 3 : 3;
  p.bombs = 3; p.power = 0;
  p.inv = 150; p.respawn = 0; p.outWait = 0;
  p.x = p.id===0 ? W/2-60 : W/2+60; p.y = H-90;
  if (!firstTime){ p.credits++; totalContinues++; }
  p.msg = 'GO!'; p.msgT = 60;
  // 参加人数が変わったら敵の耐久を調整
  hpScale = (1.0 + stageIndex*0.13) * (playingCount() > 1 ? 1.45 : 1.0);
}
function playerKeys(p){ return p.id===0 ? P1KEY : P2KEY; }

function nearestPlayer(x,y){
  let best=null, bd=1e9;
  for (const p of players){
    if (!p.playing || !p.alive) continue;
    const d = (p.x-x)*(p.x-x) + (p.y-y)*(p.y-y);
    if (d < bd){ bd=d; best=p; }
  }
  return best;
}
function anyPlayerAlive(){ return players.some(p => p.playing && p.alive); }

function updatePlayer(p){
  p.t++;
  if (p.msgT > 0) p.msgT--;

  // --- 未参加：途中参加受付 ---
  if (!p.playing){
    if ((state==='play'||state==='warning'||state==='intro') && pHit(p,'shot')){
      joinPlayer(p, true); SFX.ok();
    }
    return;
  }
  // --- 残機ゼロ：コンティニュー待ち ---
  if (p.lives < 0){
    p.outWait--;
    if (pHit(p,'shot')){ joinPlayer(p, false); SFX.ok(); }
    return;
  }
  // --- 復活待ち ---
  if (!p.alive){
    p.respawn--;
    if (p.respawn <= 0){
      p.alive = true; p.inv = 140;
      p.x = p.id===0 ? W/2-50 : W/2+50; p.y = H-70;
    }
    return;
  }

  if (p.inv > 0) p.inv--;
  if (p.bombT > 0) p.bombT--;

  const K = playerKeys(p);
  let dx = (down(K.right)?1:0) - (down(K.left)?1:0);
  let dy = (down(K.down)?1:0) - (down(K.up)?1:0);
  if (p.id === 0 && Pad.on){                 // 1P はゲームパッドでも移動できる
    const g = Pad.move();
    if (Math.abs(g.x) > Math.abs(dx)) dx = g.x;
    if (Math.abs(g.y) > Math.abs(dy)) dy = g.y;
  }
  const mag = Math.hypot(dx,dy);
  if (mag > 1){ dx /= mag; dy /= mag; }      // 斜め移動が速くならないように
  const sp = p.power >= 1 ? SPEED_FAST : SPEED_SLOW;
  p.x = clamp(p.x + dx*sp, 14, W-14);
  p.y = clamp(p.y + dy*sp, 26, H-16);

  // --- ショット ---
  if (p.fireCd > 0) p.fireCd--;
  if (p.missileCd > 0) p.missileCd--;
  if (pDown(p,'shot') && p.fireCd <= 0){
    firePlayer(p);
    p.fireCd = p.power >= 3 ? 5 : 6;
  }

  // --- ボム ---
  if (pHit(p,'bomb') && p.bombs > 0 && p.bombT <= 0){
    p.bombs--; p.bombT = 150; p.inv = Math.max(p.inv, 165);
    doBomb(p);
  }
}

/* パワー段階（最大 P4）
   0: 中央レーザー1本
   1: ＋ 自機の移動速度アップ
   2: ＋ 直進ショット2発
   3: ＋ 斜めショット2発（連射も速くなる）
   4: 中央レーザー強化                          */
const MAX_POWER    = 4;
const SPEED_SLOW   = 3.6;   // P0
const SPEED_FAST   = 4.6;   // P1 以上
function firePlayer(p){
  SFX.shot();
  const lv = p.power, x = p.x, y = p.y - 14;
  // 中央レーザー：最初からこれ1本。P4 で大幅に強化される
  pshot(p, x, y-6, 0, -15, lv >= 4 ? 12 : (lv >= 2 ? 6 : 5), 'big');
  if (lv >= 2){
    pshot(p, x-10, y+2, 0, -13, 4, 'n');
    pshot(p, x+10, y+2, 0, -13, 4, 'n');
  }
  if (lv >= 3){
    pshot(p, x-17, y+5, -0.9, -12.6, 4, 'n');
    pshot(p, x+17, y+5,  0.9, -12.6, 4, 'n');
  }
}

function doBomb(p){
  SFX.bomb();
  shake = 16; flash = 0.85; flashCol = p.col;
  // 敵弾を得点アイテムへ
  for (const b of eshots){
    if (Math.random() < 0.30) items.push({x:b.x,y:b.y,vx:rand(-1,1),vy:-1.2,type:'S',t:0});
    spark(b.x,b.y,2,'#ffd83d',2,14,2);
  }
  eshots.length = 0;
  beams.length = 0;
  // 全体ダメージ
  const DMG = 420;
  for (const e of enemies){ damageEnemy(e, DMG, p); }
  if (boss && boss.state === 'fight'){
    // 破壊可能パーツ（2面・4面ボスの砲塔／腕）
    for (const pt of boss.parts){
      if (!pt.alive) continue;
      pt.hp -= DMG; pt.flash = 4;
      if (pt.hp <= 0){ pt.alive = false; boom(boss.x+pt.dx, boss.y+pt.dy, 1.8, '#ffb85c'); p.score += 20000; }
    }
    // 衛星（5面ボス）にもダメージ
    if (boss.sats) for (const st of boss.sats){
      if (!st.alive) continue;
      st.hp -= DMG; st.flash = 4;
      if (st.hp <= 0){ st.alive = false; boom(boss.x+Math.cos(st.a)*st.r, boss.y+Math.sin(st.a)*st.r, 1.6, '#ffcf5c'); }
    }
    damageBoss(DMG, p, boss.x, boss.y);
  }
  for (let i=0;i<10;i++) spark(rand(0,W), rand(0,H*0.8), 8, p.col, 6, 34, 4);
}

function playerHitCheck(p){
  if (!p.playing || !p.alive || p.inv > 0) return;
  const r = p.hitR;
  // 敵弾
  for (let i=eshots.length-1;i>=0;i--){
    const b = eshots[i];
    if (Math.abs(b.x-p.x) < b.r+r && Math.abs(b.y-p.y) < b.r+r &&
        hyp(b.x-p.x, b.y-p.y) < b.r + r){ killPlayer(p); return; }
  }
  // 敵本体
  for (const e of enemies){
    if (e.dead) continue;
    if (hyp(e.x-p.x, e.y-p.y) < e.r*0.8 + r){ killPlayer(p); return; }
  }
  // ボス本体
  if (boss && boss.state==='fight'){
    if (Math.abs(p.x-boss.x) < boss.w/2 - 6 && Math.abs(p.y-boss.y) < boss.h/2 - 6){ killPlayer(p); return; }
  }
  // レーザー
  for (const bm of beams){
    if (!bm.active) continue;
    if (distToRay(p.x,p.y, bm.x,bm.y, bm.ang, bm.len) < bm.w*0.5 + r){ killPlayer(p); return; }
  }
}
function killPlayer(p){
  p.alive = false;
  p.lives--;
  p.power = Math.max(0, p.power - 1);
  p.respawn = 70;
  SFX.death();
  boom(p.x, p.y, 1.6, p.col);
  spark(p.x,p.y,26,'#fff',5,30,3);
  // お詫びのパワーアイテム
  if (p.lives >= 0) dropItem(p.x, Math.max(60, p.y-40), 'P');
  if (p.lives < 0){
    p.outWait = 600;   // 10秒
    p.respawn = 0;
  }
}

function drawPlayer(p){
  if (!p.playing) return;
  if (p.lives < 0){
    return;
  }
  if (!p.alive) return;
  if (p.inv > 0 && Math.floor(p.t/3)%2===0) return;

  ctx.save();
  ctx.translate(p.x, p.y);
  // エンジン炎
  const fl = 8 + Math.random()*7;
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createLinearGradient(0,8,0,8+fl);
  g.addColorStop(0, p.col); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(-5,8); ctx.lineTo(5,8); ctx.lineTo(0,8+fl); ctx.closePath(); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  // 機体
  ctx.fillStyle = '#e8f2ff';
  ctx.beginPath();
  ctx.moveTo(0,-17); ctx.lineTo(6,-2); ctx.lineTo(5,10); ctx.lineTo(-5,10); ctx.lineTo(-6,-2);
  ctx.closePath(); ctx.fill();
  // 主翼
  ctx.fillStyle = p.col2;
  ctx.beginPath();
  ctx.moveTo(-6,-1); ctx.lineTo(-19,9); ctx.lineTo(-17,13); ctx.lineTo(-5,10);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(6,-1); ctx.lineTo(19,9); ctx.lineTo(17,13); ctx.lineTo(5,10);
  ctx.closePath(); ctx.fill();
  // キャノピー
  ctx.fillStyle = p.col;
  ctx.beginPath(); ctx.ellipse(0,-6,3,6,0,0,TAU); ctx.fill();
  ctx.restore();

  // 当たり判定コア
  if (p.inv > 0){
    ctx.globalCompositeOperation='lighter';
    ctx.strokeStyle = p.col; ctx.lineWidth=1.4; ctx.globalAlpha=0.6;
    ctx.beginPath(); ctx.arc(p.x,p.y, 22 + Math.sin(p.t*0.2)*4, 0, TAU); ctx.stroke();
    ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  }
  // ボム発動エフェクト
  if (p.bombT > 0){
    const k = 1 - p.bombT/150;
    ctx.globalCompositeOperation='lighter';
    ctx.strokeStyle = p.col; ctx.lineWidth = 6*(1-k);
    ctx.globalAlpha = 0.55*(1-k*0.6);
    ctx.beginPath(); ctx.arc(p.x,p.y, 40 + k*520, 0, TAU); ctx.stroke();
    ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  }
}

/* ============================================================
   6. 敵
   ============================================================ */
let enemies = [];
let sched = [];   // 遅延スポーン
function later(delay, fn){ sched.push({t: stageTime + delay, fn}); }

const EK = {
  pop:    {hp:1,  r:12, score:120,  col:'#ff8a5c', draw:dPop,    ai:aiPop,  weak:true},
  zig:    {hp:9,  r:13, score:260,  col:'#8affd1', draw:dZig,    ai:aiZig},
  dive:   {hp:11, r:14, score:320,  col:'#ffd45c', draw:dDive,   ai:aiDive},
  sniper: {hp:16, r:14, score:480,  col:'#c98aff', draw:dSniper, ai:aiSniper},
  turret: {hp:44, r:18, score:900,  col:'#9fb4c9', draw:dTurret, ai:aiTurret},
  carrier:{hp:95, r:26, score:1800, col:'#7fa8ff', draw:dCarrier,ai:aiCarrier, drop:'B'},
  heavy:  {hp:135,r:24, score:2600, col:'#ff6d8a', draw:dHeavy,  ai:aiHeavy,   drop:'P'},
  mine:   {hp:1,  r:11, score:200,  col:'#ffe066', draw:dMine,   ai:aiMine, weak:true}
};

function spawn(kind, x, y, o){
  const k = EK[kind];
  const e = Object.assign({
    kind, x, y, k, r:k.r,
    // weak な敵は必ず1発で落ちる（面や人数によるHP補正をかけない）
    hp: k.weak ? 1 : Math.ceil(k.hp * hpScale), maxHp: k.weak ? 1 : Math.ceil(k.hp * hpScale),
    t:0, vx:0, vy:1.6, flash:0, dead:false, ang:0, phase:0, fireT:0,
    drop: k.drop || null, dir: x < W/2 ? 1 : -1
  }, o || {});
  enemies.push(e);
  return e;
}
function wave(kind, n, gap, xf, o){
  for (let i=0;i<n;i++){
    later(i*gap, () => {
      const opt = Object.assign({}, o);
      if (opt.mk) opt.mk(opt, i);
      spawn(kind, xf(i), (o && o.y0 !== undefined) ? o.y0 : -34, opt);
    });
  }
}

function damageEnemy(e, dmg, from, byFuse){
  if (e.dead) return;
  e.hp -= dmg; e.flash = 4;
  if (e.hp <= 0){
    e.dead = true;
    if (from) from.score += e.k.score;
    boom(e.x, e.y, e.r/16, e.k.col);
    if (e.r > 20) SFX.big(); else SFX.pop();
    // 機雷は時間切れで自爆したときだけ弾を撒く（撃ち落とせば安全）
    if (e.kind === 'mine' && byFuse) ringShot(e.x,e.y, 10, 2.4*bulSp, rand(0,TAU), {col:'#ffe066', r:5});
    if (e.drop) dropItem(e.x, e.y, e.drop);
    else if (Math.random() < 0.07) dropItem(e.x, e.y, pick(['S','S','B','P']));
  } else SFX.hit();
}

/* --- AI --- */
function aiPop(e){
  e.y += e.vy; e.x += e.vx;
  if (e.sine) e.x += Math.sin(e.t*0.05)*1.6;
  if (fireAt(e.t, 90, 60) && e.y > 0 && e.shoot) eshotA(e.x,e.y+8, aimAng(e.x,e.y), 2.6*bulSp, {col:'#ff9a5c'});
}
function aiZig(e){
  e.y += e.vy;
  e.x += Math.sin(e.t*0.045 + (e.ph||0)) * 2.6 * e.dir;
  if (fireAt(e.t, 76, 40) && e.y > 20) fan(e.x,e.y+8, aimAng(e.x,e.y), 2, 0.22, 2.9*bulSp, {col:'#8affd1'});
}
function aiDive(e){
  // 進入 → 停止 → 狙撃 → 加速離脱
  if (e.t < 46){ e.y += 3.4; }
  else if (e.t < 106){
    e.y += 0.35;
    e.x += Math.sin(e.t*0.07)*1.4;
    if (e.t === 62 || (dens > 0.40 && e.t === 88))
      fan(e.x,e.y+8, aimAng(e.x,e.y), 3, 0.20, 3.3*bulSp, {col:'#ffd45c'});
  } else {
    e.y += Math.min(8, (e.t-106)*0.28 + 1.5);
    e.x += e.vx;
  }
}
function aiSniper(e){
  // 横から進入し、水平移動しつつ狙撃
  if (e.t < 40){ e.y += 2.2; e.x += e.sx*2.4; }
  else { e.x += e.sx*1.5; e.y += 0.25; }
  if (e.t > 40 && fireAt(e.t, 64, 0)) fan(e.x,e.y, aimAng(e.x,e.y), 3, 0.30, 3.6*bulSp, {col:'#c98aff', type:'needle', r:4.5});
}
function aiTurret(e){
  const ty = e.ty || 130;
  if (e.y < ty) e.y += 1.8;
  else {
    e.stayT = (e.stayT||0) + 1;
    e.x += Math.sin(e.t*0.03)*0.9;
    if (fireAt(e.stayT, 96, 30)){
      const off = rand(0,TAU);
      ringShot(e.x,e.y, 10 + stageIndex, 2.4*bulSp, off, {col:'#9fd8ff'});
    }
    if (fireAt(e.stayT, 96, 66)) fan(e.x,e.y, aimAng(e.x,e.y), 3, 0.26, 3.4*bulSp, {col:'#fff2a0'});
    if (e.stayT > 560) e.y += 2.6;
  }
  e.ang += 0.05;
}
function aiCarrier(e){
  if (e.y < 110) e.y += 1.4;
  else {
    e.x += Math.sin(e.t*0.018) * 1.9;
    if (fireAt(e.t, 110, 0)){
      for (const s of [-1,1]){
        const c = spawn('pop', e.x + s*24, e.y+10, {vy:2.4, vx:s*0.9, shoot:true});
        c.t = 0;
      }
      tone(300,0.08,'square',0.05,500);
    }
    if (fireAt(e.t, 150, 80)) ringShot(e.x,e.y, 12, 2.2*bulSp, rand(0,TAU), {col:'#7fa8ff'});
  }
  if (e.t > 900) e.y += 2.2;
}
function aiHeavy(e){
  if (e.y < 120) e.y += 1.2;
  else {
    e.x += Math.sin(e.t*0.016) * 2.2;
    if (fireAt(e.t, 84, 40)) fan(e.x-22,e.y+6, aimAng(e.x,e.y), 4, 0.19, 3.2*bulSp, {col:'#ff8fa8'});
    if (fireAt(e.t, 84, 58)) fan(e.x+22,e.y+6, aimAng(e.x,e.y), 4, 0.19, 3.2*bulSp, {col:'#ff8fa8'});
    if (fireAt(e.t, 210, 150)) ringShot(e.x,e.y, 18, 2.5*bulSp, rand(0,TAU), {col:'#ffd0dc'});
  }
  if (e.t > 1000) e.y += 2.0;
}
function aiMine(e){
  e.y += e.vy * (e.t < 60 ? 1 : 0.25);
  e.x += e.vx;
  e.ang += 0.08;
  if (e.t > (e.fuse || 260)) damageEnemy(e, 9999, null, true);
}

/* --- 敵の描画 --- */
function body(e, fn){
  ctx.save(); ctx.translate(e.x, e.y);
  fn();          // 被弾中は col()/dark() が白を返すのでシルエットが白く光る
  ctx.restore();
}
function col(e){ return e.flash>0 ? '#fff' : e.k.col; }
function dark(e){ return e.flash>0 ? '#fff' : '#2b3a4d'; }

function dPop(e){ body(e, () => {
  ctx.fillStyle = col(e);
  ctx.beginPath(); ctx.moveTo(0,12); ctx.lineTo(10,-2); ctx.lineTo(5,-10); ctx.lineTo(-5,-10); ctx.lineTo(-10,-2);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = dark(e); ctx.beginPath(); ctx.arc(0,1,3.4,0,TAU); ctx.fill();
});}
function dZig(e){ body(e, () => {
  ctx.fillStyle = col(e);
  ctx.beginPath(); ctx.moveTo(0,13); ctx.lineTo(13,0); ctx.lineTo(6,-11); ctx.lineTo(-6,-11); ctx.lineTo(-13,0);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = dark(e); ctx.fillRect(-7,-4,14,6);
  ctx.fillStyle = col(e); ctx.fillRect(-2,-13,4,4);
});}
function dDive(e){ body(e, () => {
  ctx.fillStyle = dark(e);
  ctx.beginPath(); ctx.moveTo(-15,-4); ctx.lineTo(15,-4); ctx.lineTo(9,10); ctx.lineTo(-9,10); ctx.closePath(); ctx.fill();
  ctx.fillStyle = col(e);
  ctx.beginPath(); ctx.moveTo(0,14); ctx.lineTo(8,-2); ctx.lineTo(0,-14); ctx.lineTo(-8,-2); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#fff2c0'; ctx.beginPath(); ctx.arc(0,2,2.6,0,TAU); ctx.fill();
});}
function dSniper(e){ body(e, () => {
  ctx.rotate(e.sx>0 ? 0.3 : -0.3);
  ctx.fillStyle = col(e);
  ctx.beginPath(); ctx.moveTo(0,14); ctx.lineTo(11,4); ctx.lineTo(7,-13); ctx.lineTo(-7,-13); ctx.lineTo(-11,4);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = dark(e); ctx.fillRect(-9,-2,18,5);
  ctx.fillStyle='#fff'; ctx.fillRect(-1.5,6,3,8);
});}
function dTurret(e){ body(e, () => {
  ctx.fillStyle = dark(e);
  ctx.beginPath(); ctx.arc(0,0,17,0,TAU); ctx.fill();
  ctx.save(); ctx.rotate(e.ang);
  ctx.fillStyle = col(e);
  for (let i=0;i<4;i++){ ctx.rotate(TAU/4); ctx.fillRect(-3,-19,6,9); }
  ctx.restore();
  ctx.fillStyle = col(e); ctx.beginPath(); ctx.arc(0,0,10,0,TAU); ctx.fill();
  ctx.fillStyle = e.flash>0?'#fff':'#20303f'; ctx.beginPath(); ctx.arc(0,0,5,0,TAU); ctx.fill();
});}
function dCarrier(e){ body(e, () => {

/* ============================================================
   7. ボス
   ============================================================ */
let boss = null;

function makeBoss(def){
  return {
    def, name:def.name, title:def.title,
    x: W/2, y: -170, w:def.w, h:def.h,
    hp: Math.round(def.hp*bossScale), maxHp: Math.round(def.hp*bossScale),
    t:0, phase:0, phaseT:0, state:'enter', flash:0, dieT:0, ang:0, sub:0,
    parts: (def.parts||[]).map(p => Object.assign({}, p, {
      hp: Math.round(p.hp*bossScale), maxHp: Math.round(p.hp*bossScale), alive:true, flash:0
    }))
  };
}
function damageBoss(dmg, from, hx, hy){
  if (!boss || boss.state !== 'fight') return;
  // パーツ優先
  for (const p of boss.parts){
    if (!p.alive) continue;
    const px = boss.x + p.dx, py = boss.y + p.dy;
    if (hx !== undefined && hyp(hx-px, hy-py) < p.r){
      p.hp -= dmg; p.flash = 4;
      if (from) from.score += Math.round(dmg*2);
      if (p.hp <= 0){
        p.alive = false; boom(px,py, 1.8, '#ffb85c'); SFX.big();
        if (from) from.score += 20000;
      } else SFX.hit();
      return;
    }
  }
  boss.hp -= dmg; boss.flash = 3;
  if (from) from.score += Math.round(dmg*2);
  SFX.hit();
  if (boss.hp <= 0){
    boss.hp = 0; boss.state = 'dying'; boss.dieT = 0;
    eshots.length = 0; beams.length = 0;
    SFX.huge(); flash = 0.6; flashCol='#fff';
  }
}
function bossHitTest(s){
  if (!boss || boss.state !== 'fight') return false;
  for (const p of boss.parts){
    if (!p.alive) continue;
    if (hyp(s.x-(boss.x+p.dx), s.y-(boss.y+p.dy)) < p.r + s.r) return true;
  }
  return Math.abs(s.x-boss.x) < boss.w/2 && Math.abs(s.y-boss.y) < boss.h/2;
}
function bossPhaseCheck(){
  const ph = boss.def.phases;
  while (boss.phase < ph.length-1 && boss.hp/boss.maxHp <= ph[boss.phase].until){
    boss.phase++; boss.phaseT = 0;
    // 弾消し＋演出
    for (const b of eshots) if (Math.random()<0.25) items.push({x:b.x,y:b.y,vx:rand(-1,1),vy:-1.2,type:'S',t:0});
    eshots.length = 0; beams.length = 0;
    shake = 12; flash = 0.45; flashCol = '#ffcf66';
    SFX.big();
  }
}
function updateBoss(){
  if (!boss) return;
  boss.t++; boss.ang += 0.02;
  if (boss.flash>0) boss.flash--;
  for (const p of boss.parts) if (p.flash>0) p.flash--;

  if (boss.state === 'enter'){
    boss.y += 1.9;
    if (boss.y >= boss.def.ey){ boss.y = boss.def.ey; boss.state = 'fight'; boss.phaseT = 0; }
  } else if (boss.state === 'fight'){
    boss.phaseT++;
    boss.def.phases[boss.phase].run(boss, boss.phaseT);
    bossPhaseCheck();
  } else if (boss.state === 'dying'){
    boss.dieT++;
    if (boss.dieT % 7 === 0){
      boom(boss.x + rand(-boss.w/2, boss.w/2), boss.y + rand(-boss.h/2, boss.h/2), 1.5, pick(['#ffd27a','#ff7a5c','#fff']));
      SFX.pop();
    }
    if (boss.dieT === 130){
      boom(boss.x, boss.y, 5, '#fff'); SFX.huge(); flash = 1.0; flashCol='#fff'; shake = 22;
      for (const p of players) if (p.playing && p.lives >= 0) p.score += boss.def.bonus;
      for (let i=0;i<3;i++) dropItem(boss.x + rand(-60,60), boss.y, pick(['P','B','S','S']));
    }
    if (boss.dieT > 190){ boss = null; stageCleared(); }
  }
}
function drawBoss(){
  if (!boss) return;
  ctx.save();
  ctx.translate(boss.x, boss.y);
  if (boss.state === 'dying' && Math.floor(boss.dieT/4)%2===0) ctx.globalAlpha = 0.55;
  // 被弾時は機体そのものを明るくする（矩形を重ねない）
  const canFilter = typeof ctx.filter === 'string';
  if (boss.flash > 0 && canFilter) ctx.filter = 'brightness(2.2) saturate(0.4)';
  boss.def.draw(boss, ctx);
  if (canFilter) ctx.filter = 'none';
  ctx.restore();
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* --- レーザー（ビーム） --- */
function updateBeams(){
  for (let i=beams.length-1;i>=0;i--){
    const b = beams[i];
    b.t++;
    if (b.owner){
      b.x = b.owner.x + (b.ox||0); b.y = b.owner.y + (b.oy||0);
    }
    if (b.rot) b.ang += b.rot;
    if (b.t === b.charge) SFX.laser();
    b.active = b.t > b.charge && b.t <= b.charge + b.dur;
    if (b.t > b.charge + b.dur) beams.splice(i,1);
  }
}
function drawBeams(){
  ctx.globalCompositeOperation = 'lighter';
  for (const b of beams){
    const ex = b.x + Math.cos(b.ang)*b.len, ey = b.y + Math.sin(b.ang)*b.len;
    if (!b.active){
      const k = b.t/b.charge;
      ctx.globalAlpha = 0.35 + 0.35*Math.sin(b.t*0.6);
      ctx.strokeStyle = '#ff5a5a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(ex,ey); ctx.stroke();
      ctx.globalAlpha = 0.8*k;
      ctx.fillStyle = '#ff9a9a';
      ctx.beginPath(); ctx.arc(b.x,b.y, 6+10*k, 0, TAU); ctx.fill();
    } else {
      const fade = Math.min(1, (b.charge + b.dur - b.t)/10);
      ctx.globalAlpha = 0.35*fade;
      ctx.strokeStyle = '#ff3b6b'; ctx.lineWidth = b.w*1.9;
      ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(ex,ey); ctx.stroke();
      ctx.globalAlpha = 0.85*fade;
      ctx.strokeStyle = '#ffd0e0'; ctx.lineWidth = b.w*0.85;
      ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(ex,ey); ctx.stroke();
      ctx.globalAlpha = fade;
      ctx.strokeStyle = '#fff'; ctx.lineWidth = b.w*0.35;
      ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(ex,ey); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

   8. ボス定義（全5面）
   ============================================================ */
/* ボスの左右移動。
   位相を積算するのでフェーズが変わって速度・振幅が変わっても位置が連続し、
   さらに 1フレームの移動量に上限を設けるので、どんな状態からでも瞬間移動しない。 */
const BOSS_MAX_SPEED = 4.2;
function bossMove(b, amp, spd, base, ampY, spdY){
  if (b.mph === undefined){
    b.mph = 0; b.mphY = 0;
    b.amp = amp; b.ampY = (ampY === undefined ? 8 : ampY);
    b.baseY = (base === undefined ? b.y : base);
  }
  b.mph  += spd;
  b.mphY += (spdY === undefined ? spd*0.7 : spdY);
  // 振幅・中心はゆっくり追従させる（切り替わりを目立たせない）
  b.amp  += clamp(amp - b.amp, -0.8, 0.8);
  b.ampY += clamp((ampY === undefined ? 8 : ampY) - b.ampY, -0.3, 0.3);
  const tx = W/2 + Math.sin(b.mph) * b.amp;
  b.x += clamp(tx - b.x, -BOSS_MAX_SPEED, BOSS_MAX_SPEED);
  if (base !== undefined){
    b.baseY += clamp(base - b.baseY, -0.5, 0.5);
    const ty = b.baseY + Math.sin(b.mphY) * b.ampY;
    b.y += clamp(ty - b.y, -BOSS_MAX_SPEED, BOSS_MAX_SPEED);
  }
}

/* 衛星の当たり判定（BOSS5専用） */
function satHitTest(s){
  if (!boss || !boss.sats || boss.state !== 'fight') return null;
  for (const st of boss.sats){
    if (!st.alive) continue;
    const sx = boss.x + Math.cos(st.a)*st.r, sy = boss.y + Math.sin(st.a)*st.r;
    if (hyp(s.x-sx, s.y-sy) < 18 + s.r) return {st, sx, sy};
  }
  return null;
}

/* ============================================================
   9. 背景（面ごと）
   ============================================================ */
let bgProps = [], stars = [];
function initStars(){
  stars = [];
  for (let i=0;i<130;i++) stars.push({x:rand(0,W), y:rand(0,H), z:rand(0.4,3.2)});
}
initStars();

function initBG(idx){
  bgProps = [];
  if (idx === 0){ // 空：雲
    for (let i=0;i<16;i++) bgProps.push({x:rand(-40,W+40), y:rand(-H,H), s:rand(0.5,1.6), sp:rand(0.6,2.2), a:rand(0.25,0.7)});
  } else if (idx === 1){ // 海：島と白波
    for (let i=0;i<10;i++) bgProps.push({x:rand(20,W-20), y:rand(-H,H), s:rand(0.6,1.8), sp:rand(0.8,1.6), a:1, t:rand(0,10)});
  } else if (idx === 2){ // 峡谷：岩
    for (let i=0;i<18;i++) bgProps.push({x:rand(0,W), y:rand(-H,H), s:rand(0.5,1.7), sp:rand(1.0,2.4), a:1, r:rand(0,TAU)});
  } else if (idx === 3){ // 都市：ビル
    for (let i=0;i<24;i++) bgProps.push({x:rand(-20,W+20), y:rand(-H,H), s:rand(0.5,1.5), sp:rand(0.8,2.4), a:1,
      w:rand(28,70), h:rand(70,200), seed:rint(0,9999)});
  } else { // 宇宙要塞：パネル
    for (let i=0;i<20;i++) bgProps.push({x:rand(0,W), y:rand(-H,H), s:rand(0.6,1.6), sp:rand(1.2,2.8), a:1, seed:rint(0,9999)});
  }
}

function updateBG(){
  scrollY += bgSpeed;
  for (const s of stars){ s.y += s.z*bgSpeed*0.7; if (s.y > H){ s.y = -4; s.x = rand(0,W); } }
  for (const p of bgProps){
    p.y += p.sp * bgSpeed * 0.5;
    if (p.y > H + 220){ p.y = -rand(120, 320); p.x = rand(-20, W+20); }
  }
}

function drawBG(idx){
  if (idx === 0){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#03142c'); g.addColorStop(0.45,'#0f3457'); g.addColorStop(1,'#255273');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    for (const p of bgProps){
      ctx.globalAlpha = p.a*0.55;
      ctx.fillStyle = '#8fa6bd';
      const s = p.s;
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, 42*s, 15*s, 0,0,TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(p.x-24*s, p.y+5*s, 24*s, 10*s, 0,0,TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(p.x+26*s, p.y+4*s, 26*s, 11*s, 0,0,TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  } else if (idx === 1){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#01121e'); g.addColorStop(0.5,'#022840'); g.addColorStop(1,'#054259');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // 波（島より奥）
    ctx.strokeStyle='rgba(255,255,255,0.14)'; ctx.lineWidth=2;
    for (let i=0;i<12;i++){
      const y = ((scrollY*0.9 + i*58) % (H+60)) - 30;
      ctx.beginPath();
      for (let x=0;x<=W;x+=24) ctx.lineTo(x, y + Math.sin((x*0.03)+(scrollY*0.02)+i)*5);
      ctx.stroke();
    }
    // 島（砂浜のふちを全周に）
    for (const p of bgProps){
      ctx.fillStyle = 'rgba(180,220,240,0.28)';
      ctx.beginPath(); ctx.ellipse(p.x, p.y, 62*p.s, 34*p.s, 0,0,TAU); ctx.fill();
      ctx.fillStyle = '#8f7a4e';
      ctx.beginPath(); ctx.ellipse(p.x, p.y, 56*p.s, 30*p.s, 0,0,TAU); ctx.fill();
      ctx.fillStyle = '#14503c';
      ctx.beginPath(); ctx.ellipse(p.x, p.y-2*p.s, 45*p.s, 22*p.s, 0,0,TAU); ctx.fill();
      ctx.fillStyle = '#1d6a4c';
      ctx.beginPath(); ctx.ellipse(p.x-10*p.s, p.y-6*p.s, 22*p.s, 10*p.s, 0,0,TAU); ctx.fill();
    }
  } else if (idx === 2){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#160a04'); g.addColorStop(0.5,'#3d2210'); g.addColorStop(1,'#5e3a1a');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // 峡谷の壁
    ctx.fillStyle='#241206';
    for (let i=0;i<20;i++){
      const y = ((scrollY*1.2 + i*70) % (H+140)) - 70;
      const w1 = 40 + Math.sin(i*1.7)*22, w2 = 40 + Math.cos(i*1.3)*24;
      ctx.fillRect(0, y, w1, 72); ctx.fillRect(W-w2, y, w2, 72);
    }
    for (const p of bgProps){
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.fillStyle='#301a09';
      ctx.beginPath();
      for (let i=0;i<6;i++){ const a=i*TAU/6; const rr = 24*p.s*(0.7+((i*37)%10)/16);
        i?ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr):ctx.moveTo(Math.cos(a)*rr, Math.sin(a)*rr); }
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  } else if (idx === 3){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#040814'); g.addColorStop(1,'#141d3a');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    for (const s of stars){ ctx.globalAlpha=0.5; ctx.fillStyle='#9fc'; ctx.fillRect(s.x,s.y,1,1); }
    ctx.globalAlpha=1;
    for (const p of bgProps){
      const w = p.w*p.s*0.7, h = p.h*p.s*0.7;
      ctx.fillStyle = p.s > 1.1 ? '#1b2547' : '#101733';
      ctx.fillRect(p.x-w/2, p.y-h/2, w, h);
      // 窓
      let sd = p.seed;
      const cols = Math.max(2, Math.floor(w/9)), rows = Math.max(3, Math.floor(h/12));
      for (let r=0;r<rows;r++) for (let c2=0;c2<cols;c2++){
        sd = (sd*1103515245 + 12345) & 0x7fffffff;
        if ((sd % 100) < 42){
          ctx.fillStyle = (sd%7===0) ? '#ffd27a' : '#7fd8ff';
          ctx.globalAlpha = 0.55;
          ctx.fillRect(p.x-w/2 + 3 + c2*(w-6)/cols, p.y-h/2 + 4 + r*(h-8)/rows, 3.5, 4);
        }
      }
      ctx.globalAlpha=1;
      // 屋上灯
      ctx.fillStyle = (Math.floor(scrollY/30)+p.seed)%4===0 ? '#ff5a5a' : '#802020';
      ctx.fillRect(p.x-2, p.y-h/2-4, 4, 4);
    }
  } else {
    ctx.fillStyle='#02030a'; ctx.fillRect(0,0,W,H);
    for (const s of stars){
      ctx.globalAlpha = clamp(s.z/3.2,0.2,1);
      ctx.fillStyle = s.z>2.4 ? '#fff' : (s.z>1.4 ? '#bcd8ff' : '#6a86c0');
      ctx.fillRect(s.x, s.y, s.z>2.4?2:1, s.z>2.4?3:1);
    }
    ctx.globalAlpha=1;
    // 要塞パネル
    for (const p of bgProps){
      const w = 70*p.s, h = 100*p.s;
      ctx.fillStyle='#0d1524'; ctx.fillRect(p.x-w/2, p.y-h/2, w, h);
      ctx.strokeStyle='#1e3252'; ctx.lineWidth=2; ctx.strokeRect(p.x-w/2, p.y-h/2, w, h);
      ctx.fillStyle='#16233a';
      ctx.fillRect(p.x-w/2+6, p.y-h/2+6, w-12, 10);
      ctx.fillStyle = ((p.seed + Math.floor(scrollY/24)) % 5 === 0) ? '#2fd0ff' : '#134a63';
      ctx.fillRect(p.x-w/2+8, p.y+h/2-16, w-16, 5);
    }
    // 中央パイプライン
    ctx.strokeStyle='rgba(60,120,200,0.25)'; ctx.lineWidth=6;
    for (let i=0;i<4;i++){
      const x = 60 + i*120;
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
    }
    ctx.strokeStyle='rgba(120,220,255,0.35)'; ctx.lineWidth=3;
    for (let i=0;i<4;i++){
      const x = 60 + i*120;
      const y = ((scrollY*3 + i*160) % (H+120)) - 60;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y+50); ctx.stroke();
    }
  }
}

/* ============================================================
   11. ゲーム進行
   ============================================================ */
let state = 'title';          // title / intro / play / warning / clear / gameover / ending
let paused = false;
let stageIndex = 0, stageTime = 0, scriptPtr = 0;
let scrollY = 0, bgSpeed = 2.0;
let bulSp = 1.0, hpScale = 1.0, bossScale = 1.0;
let dens = 1.0, cdens = 1.0;   // 弾密度（面ごと）／一度に撒く弾数の係数
const FIRE_RATE = 0.5;         // 敵弾の発射頻度の全体倍率
let bossSpawned = false, warnT = 0, introT = 0, clearT = 0, overT = 0, endT = 0;
let gameFrame = 0, totalContinues = 0;

// タイトル画面
let menuSel = 0, menuPlayers = 1, menuStage = 0, menuSound = true;
const MENU_ROWS = 4;

function resetRun(){
  players = [makePlayer(0), makePlayer(1)];
  players[0].playing = true; players[0].alive = true; players[0].inv = 140;
  if (menuPlayers === 2){ players[1].playing = true; players[1].alive = true; players[1].inv = 140; }
  totalContinues = 0;
  stageIndex = menuStage;
  startStage(stageIndex);
}
function clearField(){
  enemies.length = 0; eshots.length = 0; pshots.length = 0;
  items.length = 0; beams.length = 0; particles.length = 0;
  sched.length = 0; boss = null;
}
function startStage(idx){
  clearField();
  stageIndex = idx;
  stageTime = 0; scriptPtr = 0; bossSpawned = false;
  const st = STAGES[idx];
  bgSpeed = st.speed;
  bulSp   = 0.88 + idx*0.07;
  dens    = st.dens * FIRE_RATE;   // 発射間隔（小さいほど間隔が長い）
  cdens   = Math.sqrt(st.dens);    // 1回に撒く弾数（頻度とは独立に決める）
  hpScale = (1.0 + idx*0.13) * (playingCount() > 1 ? 1.45 : 1.0);
  bossScale = (playingCount() > 1 ? 1.75 : 1.0);
  initBG(idx); initStars();
  state = 'intro'; introT = 0;
  Bgm.play(st.bgm);
}
function playingCount(){ return players.filter(p => p.playing).length; }

function stageCleared(){
  state = 'clear'; clearT = 0;
  eshots.length = 0; beams.length = 0;
  // ボーナス
  for (const p of players){
    if (!p.playing || p.lives < 0) continue;
    p.stageBonus = p.lives*10000 + p.bombs*4000 + (stageIndex+1)*20000;
    p.score += p.stageBonus;
  }
  Bgm.play('ending');
}

function summonBoss(){
  bossSpawned = true;
  state = 'warning'; warnT = 0;
  enemies.length = 0;
  SFX.warn();
  Bgm.play(stageIndex === 4 ? 'last' : 'boss');
}

function updatePlay(){
  stageTime++;
  updateBG();

  // 予約スポーン
  for (let i=sched.length-1;i>=0;i--){
    if (sched[i].t <= stageTime){ sched[i].fn(); sched.splice(i,1); }
  }
  // ステージスクリプト
  const st = STAGES[stageIndex];
  while (scriptPtr < st.script.length && st.script[scriptPtr].t <= stageTime){
    st.script[scriptPtr].f(); scriptPtr++;
  }
  if (!bossSpawned && stageTime >= st.bossAt) summonBoss();

  updateEnemies();
  updateBoss();
  updateBeams();
  updateShots();
  updateItems();
  for (const p of players){ updatePlayer(p); playerHitCheck(p); }
  updateParticles();

  // ゲームオーバー判定
  const active = players.filter(p => p.playing);
  if (active.length > 0 && active.every(p => p.lives < 0)){
    const anyWait = active.some(p => p.outWait > 0);
    if (!anyWait){ state = 'gameover'; overT = 0; Bgm.stop(); }
  }
}

function updateShots(){
  // 自機弾
  for (let i=pshots.length-1;i>=0;i--){
    const s = pshots[i]; s.t++;
    if (s.type === 'm'){
      // ホーミングミサイル
      let tx=null, ty=null, bd=1e9;
      for (const e of enemies){ const d=hyp(e.x-s.x,e.y-s.y); if (d<bd){bd=d;tx=e.x;ty=e.y;} }
      if (boss && boss.state==='fight'){ const d=hyp(boss.x-s.x,boss.y-s.y); if (d<bd){bd=d;tx=boss.x;ty=boss.y;} }
      if (tx !== null && s.t < 90){
        const want = Math.atan2(ty-s.y, tx-s.x);
        const cur = Math.atan2(s.vy, s.vx);
        const na = cur + clamp(angDiff(cur,want), -0.14, 0.14);
        const sp = Math.min(12, hyp(s.vx,s.vy) + 0.25);
        s.vx = Math.cos(na)*sp; s.vy = Math.sin(na)*sp;
      } else {
        const sp = Math.min(13, hyp(s.vx,s.vy)+0.3);
        const a = Math.atan2(s.vy,s.vx);
        s.vx = Math.cos(a)*sp; s.vy = Math.sin(a)*sp;
      }
      if (s.t % 3 === 0) particles.push({x:s.x,y:s.y,vx:0,vy:1,life:10,max:10,col:s.owner.col,size:3,drag:0.9});
    }
    s.x += s.vx; s.y += s.vy;
    if (s.y < -30 || s.y > H+30 || s.x < -30 || s.x > W+30){ pshots.splice(i,1); continue; }

    let gone = false;
    // 敵に命中
    for (const e of enemies){
      if (e.dead) continue;
      if (hyp(e.x-s.x, e.y-s.y) < e.r + s.r){
        damageEnemy(e, s.dmg, s.owner);
        spark(s.x,s.y,2,'#fff',2,8,2);
        gone = true; break;
      }
    }
    if (!gone && boss && boss.state === 'fight'){
      const sat = satHitTest(s);
      if (sat){
        sat.st.hp -= s.dmg; sat.st.flash = 4;
        s.owner.score += s.dmg*2;
        if (sat.st.hp <= 0){ sat.st.alive = false; boom(sat.sx, sat.sy, 1.6, '#ffcf5c'); SFX.big(); s.owner.score += 15000; }
        else SFX.hit();
        gone = true;
      } else if (bossHitTest(s)){
        damageBoss(s.dmg, s.owner, s.x, s.y);
        spark(s.x,s.y,2,'#fff',2,8,2);
        gone = true;
      }
    }
    if (gone) pshots.splice(i,1);
  }

  // 敵弾
  for (let i=eshots.length-1;i>=0;i--){
    const b = eshots[i]; b.t++;
    if (b.homing > 0 && b.t < b.homing){
      const p = nearestPlayer(b.x,b.y);
      if (p){
        const want = Math.atan2(p.y-b.y, p.x-b.x);
        const cur = Math.atan2(b.vy,b.vx);
        const na = cur + clamp(angDiff(cur,want), -0.035, 0.035);
        const sp = Math.min(4.6*bulSp, hyp(b.vx,b.vy) + 0.055);
        b.vx = Math.cos(na)*sp; b.vy = Math.sin(na)*sp;
      }
      if (b.t % 4 === 0) particles.push({x:b.x,y:b.y,vx:0,vy:0,life:12,max:12,col:'#ff9a5c',size:3,drag:0.9});
    }
    b.x += b.vx; b.y += b.vy;
    if (b.x < -40 || b.x > W+40 || b.y < -60 || b.y > H+40 || b.t > 1200) eshots.splice(i,1);
  }
}

function drawShots(){
  // 自機弾
  ctx.globalCompositeOperation = 'lighter';
  for (const s of pshots){
    const c = s.owner.col;
    if (s.type === 'big'){
      ctx.fillStyle = c; ctx.globalAlpha=0.8;
      ctx.fillRect(s.x-3.2, s.y-14, 6.4, 26);
      ctx.globalAlpha=1; ctx.fillStyle='#fff';
      ctx.fillRect(s.x-1.0, s.y-11, 2.0, 20);
    } else if (s.type === 'm'){
      ctx.fillStyle = c; ctx.globalAlpha=0.8;
      const a = Math.atan2(s.vy,s.vx);
      ctx.save(); ctx.translate(s.x,s.y); ctx.rotate(a+Math.PI/2);
      ctx.fillRect(-2.5,-7,5,14); ctx.fillStyle='#fff'; ctx.fillRect(-1.2,-7,2.4,7);
      ctx.restore(); ctx.globalAlpha=1;
    } else {
      ctx.fillStyle = c; ctx.globalAlpha=0.85;
      ctx.fillRect(s.x-3, s.y-9, 6, 18);
      ctx.globalAlpha=1; ctx.fillStyle='#fff';
      ctx.fillRect(s.x-0.8, s.y-7, 1.6, 13);
    }
  }
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';

  // 敵弾（どんな背景でも見えるよう暗い縁取りを付ける）
  const RIM = 'rgba(6,8,16,0.9)';
  for (const b of eshots){
    if (b.type === 'needle'){
      const a = Math.atan2(b.vy,b.vx);
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(a+Math.PI/2);
      ctx.fillStyle = RIM; ctx.fillRect(-b.r*0.55-1.6, -b.r*2.0-1.6, b.r*1.1+3.2, b.r*4.0+3.2);
      ctx.fillStyle = b.col; ctx.fillRect(-b.r*0.55, -b.r*2.0, b.r*1.1, b.r*4.0);
      ctx.fillStyle = '#fff'; ctx.fillRect(-b.r*0.22, -b.r*1.5, b.r*0.44, b.r*3.0);
      ctx.restore();
    } else if (b.type === 'missile'){
      const a = Math.atan2(b.vy,b.vx);
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(a+Math.PI/2);
      ctx.beginPath();
      ctx.moveTo(0,-10); ctx.lineTo(5,4); ctx.lineTo(0,9); ctx.lineTo(-5,4); ctx.closePath();
      ctx.strokeStyle = RIM; ctx.lineWidth = 3.4; ctx.lineJoin='round'; ctx.stroke();
      ctx.fillStyle = b.col; ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,-2,2.4,0,TAU); ctx.fill();
      ctx.restore();
    } else {
      ctx.fillStyle = RIM;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r+1.7,0,TAU); ctx.fill();
      ctx.fillStyle = b.col;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU); ctx.fill();
      ctx.fillStyle = b.core;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r*0.45,0,TAU); ctx.fill();
    }
  }
}

/* ============================================================
   12. HUD・各画面の描画
   ============================================================ */
function txt(s,x,y,size,color,align,weight){
  ctx.font = (weight||'bold') + ' ' + size + 'px "Hiragino Sans","Yu Gothic",sans-serif';
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = color; ctx.fillText(s,x,y);
}
function txtOutline(s,x,y,size,color,align,ow){
  ctx.font = 'bold ' + size + 'px "Hiragino Sans","Yu Gothic",sans-serif';
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic';
  ctx.lineWidth = ow || 4; ctx.strokeStyle = '#000a14'; ctx.lineJoin='round';
  ctx.strokeText(s,x,y);
  ctx.fillStyle = color; ctx.fillText(s,x,y);
}
const pad = (n,l) => String(n).padStart(l,'0');

function drawHUD(){
  ctx.fillStyle = 'rgba(2,8,18,0.72)';
  ctx.fillRect(0,0,W,26);
  ctx.fillStyle = 'rgba(90,180,255,0.35)';
  ctx.fillRect(0,26,W,1);

  // 1P
  const p1 = players[0], p2 = players[1];
  drawSide(p1, 6, 'left');
  drawSide(p2, W-6, 'right');
  // 中央：ステージ
  txt(STAGES[stageIndex].name, W/2, 12, 11, '#cfe8ff', 'center');
  txt(STAGES[stageIndex].title, W/2, 23, 10, '#7fb0d8', 'center');

  function drawSide(p, x, align){
    const over = (state === 'gameover');
    if (!p.playing){
      if (!over) txt((p.id+1)+'P: SHOTで参加', x, 12, 10, '#4d6a8c', align);
      return;
    }
    const c = p.col;
    txt((p.id+1)+'P', x, 11, 10, c, align);
    txt(pad(p.score,8), x + (align==='left'?22:-22), 11, 11, '#fff', align);
    // 残機・ボム
    let s = '';
    if (p.lives < 0) s = (!over && Math.floor(gameFrame/50)%2) ? 'SHOTで復帰' : 'GAME OVER';
    else s = '残 ' + p.lives + '　ボム ' + p.bombs + '　P' + p.power;
    txt(s, x, 22, 10, p.lives<0 ? '#ff6a8a' : '#a8d8ff', align);
  }

  // ボス HP バー
  if (boss && (boss.state === 'fight' || boss.state === 'dying')){
    const k = clamp(boss.hp/boss.maxHp, 0, 1);
    ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(30,31,W-60,9);
    const g = ctx.createLinearGradient(30,0,W-30,0);
    g.addColorStop(0,'#ff2d55'); g.addColorStop(0.5,'#ff8a3b'); g.addColorStop(1,'#ffd83d');
    ctx.fillStyle=g; ctx.fillRect(31,32,(W-62)*k,7);
    ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=1; ctx.strokeRect(30.5,31.5,W-61,8);
    txt(boss.title, W/2, 51, 11, '#ffb0c0', 'center');
  }

  // プレイヤーメッセージ
  for (const p of players){
    if (p.playing && p.msgT > 0 && p.alive){
      const a = clamp(p.msgT/40,0,1);
      ctx.globalAlpha = a;
      txtOutline(p.msg, p.x, p.y - 30, 13, p.col, 'center', 3);
      ctx.globalAlpha = 1;
    }
    // コンティニュー待ち
    if (p.playing && p.lives < 0 && p.outWait > 0){
      const sec = Math.ceil(p.outWait/60);
      const x = playingCount() > 1 ? (p.id===0 ? W*0.28 : W*0.72) : W/2;
      txtOutline((p.id+1)+'P CONTINUE?', x, H*0.44, 16, '#ffd83d', 'center');
      txtOutline(String(sec), x, H*0.44+30, 26, sec<=3 ? '#ff4d6d' : '#fff', 'center');
      txtOutline('SHOTボタンで復帰', x, H*0.44+50, 11, '#a8d8ff', 'center');
    }
  }
}

function drawTitle(){
  // 背景
  ctx.fillStyle='#02030a'; ctx.fillRect(0,0,W,H);
  for (const s of stars){
    ctx.globalAlpha = clamp(s.z/3.2,0.2,1);
    ctx.fillStyle = s.z>2.4 ? '#fff' : '#8fb8ff';
    ctx.fillRect(s.x,s.y,s.z>2.4?2:1,s.z>2.4?2:1);
  }
  ctx.globalAlpha=1;
  // 惑星
  const g = ctx.createRadialGradient(W*0.75, 130, 10, W*0.75, 130, 120);
  g.addColorStop(0,'#3a6fd8'); g.addColorStop(0.6,'#16336b'); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(W*0.75,130,120,0,TAU); ctx.fill();

  const t = gameFrame;
  txtOutline('STELLAR', W/2, 180, 54, '#7fd8ff', 'center', 6);
  txtOutline('ASSAULT', W/2, 228, 54, '#ffd83d', 'center', 6);
  txt('縦スクロールシューティング　全5面', W/2, 254, 12, '#9fc4e8', 'center');

  const rows = [
    'プレイ人数    ' + (menuPlayers===1 ? '◀ 1人プレイ ▶' : '◀ 2人同時プレイ ▶'),
    '開始ステージ  ◀ 第' + (menuStage+1) + '面 ▶',
    'サウンド      ◀ ' + (menuSound ? 'ON' : 'OFF') + ' ▶',
    'ゲームスタート'
  ];
  for (let i=0;i<rows.length;i++){

    const sel = i === menuSel;
    if (sel){

      ctx.fillRect(70, y-19, W-140, 26);
      txtOutline('▶', 82, y, 15, '#ffd83d', 'left', 3);
    }
    txtOutline(rows[i], W/2+8, y, 15, sel ? '#fff' : '#8fb0cc', 'center', 3);
  }

  ctx.globalAlpha = 0.55 + 0.45*Math.sin(t*0.07);
  txtOutline(Pad.on ? '決定：A / START　　選択：十字・左スティック　　（キーボードも使えます）'
                    : '決定：Space / Enter　　選択：W/S・↑↓　　変更：A/D・←→',
             W/2, 500, 11, '#cfe8ff', 'center', 3);
  ctx.globalAlpha = 1;

  ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fillRect(24, 514, W-48, 112);
  txt('■ 操作方法', 36, 534, 12, '#7fd8ff');
  txt('1P： W A S D 移動 ／ Space ショット ／ Q・左Shift ボム', 36, 554, 11, '#bcd8f0');
  txt('2P： ↑↓←→ 移動 ／ Enter・テンキー0 ショット ／ ／・右Shift ボム', 36, 572, 11, '#bcd8f0');
  if (Pad.on){
    const nm = Pad.name.replace(/\s*\([^)]*\)\s*/g,'').trim().slice(0,26) || 'ゲームパッド';
    txt('1P パッド： ' + nm, 36, 592, 11, '#7dff8a');
    txt('　左スティック/十字 移動 ／ A・X ショット ／ B・Y ボム ／ START 一時停止', 36, 608, 10, '#7dff8a');
  } else {
    txt('1P はゲームパッドでも操作できます（接続後、ボタンを1回押してください）', 36, 592, 11, '#7fa8c8');
    txt('P 一時停止　M サウンド切替　　2Pはゲーム中でも途中参加できます', 36, 610, 11, '#7fa8c8');
  }
}

function updateTitle(){
  for (const s of stars){ s.y += s.z*0.6; if (s.y>H){ s.y=-2; s.x=rand(0,W); } }
  const up = hit(['KeyW','ArrowUp'])    || Pad.navUp();
  const dn = hit(['KeyS','ArrowDown'])  || Pad.navDown();
  const lf = hit(['KeyA','ArrowLeft'])  || Pad.navLeft();
  const rt = hit(['KeyD','ArrowRight']) || Pad.navRight();
  const ok = hit(['Space','Enter','Numpad0','NumpadEnter']) || Pad.hit(PAD_SHOT) || Pad.hit(PAD_START);
  if (up){ menuSel = (menuSel+MENU_ROWS-1)%MENU_ROWS; SFX.menu(); }
  else if (dn){ menuSel = (menuSel+1)%MENU_ROWS; SFX.menu(); }
  else if (lf || rt){
    const d = rt ? 1 : -1;
    if (menuSel===0){ menuPlayers = menuPlayers===1?2:1; SFX.menu(); }
    else if (menuSel===1){ menuStage = (menuStage + d + 5)%5; SFX.menu(); }
    else if (menuSel===2){ menuSound = !menuSound; setSound(menuSound); SFX.menu(); }
  }
  if (ok){
    if (menuSel===3){ SFX.ok(); setSound(menuSound); resetRun(); }
    else if (menuSel===0){ menuPlayers = menuPlayers===1?2:1; SFX.menu(); }
    else if (menuSel===2){ menuSound = !menuSound; setSound(menuSound); SFX.menu(); }
    else SFX.menu();
  }
  Bgm.play('title');
}

function drawIntro(){
  const t = introT;
  const a = t < 30 ? t/30 : (t > 130 ? Math.max(0,(160-t)/30) : 1);
  ctx.globalAlpha = a;
  ctx.fillStyle='rgba(0,10,24,0.55)'; ctx.fillRect(0, H/2-70, W, 140);
  ctx.fillStyle='#7fd8ff'; ctx.fillRect(0, H/2-70, W, 2); ctx.fillRect(0, H/2+68, W, 2);
  txtOutline('STAGE ' + (stageIndex+1), W/2, H/2-16, 34, '#ffd83d', 'center', 5);
  txtOutline(STAGES[stageIndex].title, W/2, H/2+26, 22, '#e8f4ff', 'center', 5);
  ctx.globalAlpha = 1;
}

function drawWarning(){
  const t = warnT;
  const blink = Math.floor(t/8)%2===0;
  ctx.save();
  ctx.globalAlpha = 0.30;
  ctx.fillStyle = '#ff0033';
  const off = (t*4)%40;
  for (let i=-2;i<W/20+2;i++){
    ctx.save();
    ctx.translate(i*40 + off, H/2-56);
    ctx.transform(1,0,-0.45,1,0,0);
    ctx.fillRect(0,0,20,112);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle='rgba(4,0,8,0.55)'; ctx.fillRect(0,H/2-58,W,116);
  ctx.strokeStyle='#ff2d55'; ctx.lineWidth=3;
  ctx.strokeRect(2, H/2-58, W-4, 116);
  if (blink) txtOutline('W A R N I N G', W/2, H/2-8, 36, '#ff3b6b', 'center', 6);
  txtOutline('巨大機影接近', W/2, H/2+28, 20, '#ffd83d', 'center', 5);
  txtOutline(BOSSES[stageIndex].title, W/2, H/2+50, 13, '#ffffff', 'center', 4);
  ctx.restore();
}

function drawClear(){
  const t = clearT;
  ctx.fillStyle = 'rgba(0,6,16,' + clamp(t/40,0,0.72) + ')';
  ctx.fillRect(0,0,W,H);
  if (t < 12) return;
  txtOutline('STAGE ' + (stageIndex+1) + ' CLEAR!', W/2, 170, 30, '#ffd83d', 'center', 5);
  let y = 250;
  for (const p of players){
    if (!p.playing || p.lives < 0) continue;
    txtOutline((p.id+1)+'P  ボーナス', W/2-30, y, 15, p.col, 'right', 4);
    if (t > 40) txtOutline(String(p.stageBonus||0), W/2+30, y, 15, '#fff', 'left', 4);
    y += 34;
    if (t > 70){ txtOutline('スコア  ' + pad(p.score,8), W/2, y, 14, '#bcd8f0', 'center', 4); y += 40; }
  }
  if (t > 110){
    const nx = stageIndex + 1;
    if (nx < 5) txtOutline('次のステージへ… ' + Math.ceil((190-t)/60) , W/2, 470, 16, '#8fd8ff','center',4);
  }
}

function drawGameOver(){
  ctx.fillStyle = 'rgba(0,0,0,' + clamp(overT/50,0,0.85) + ')';
  ctx.fillRect(0,0,W,H);
  txtOutline('GAME OVER', W/2, 250, 40, '#ff3b6b', 'center', 6);
  let y = 320;
  for (const p of players){
    if (!p.playing) continue;
    txtOutline((p.id+1)+'P スコア  ' + pad(p.score,8), W/2, y, 16, p.col, 'center', 4);
    y += 32;
  }
  txtOutline('到達：STAGE ' + (stageIndex+1) + '　' + STAGES[stageIndex].title, W/2, y+16, 13, '#9fc4e8','center',4);
  if (overT > 100){
    ctx.globalAlpha = 0.5 + 0.5*Math.sin(gameFrame*0.09);
    txtOutline(Pad.on ? '何かキー／パッドのボタンでタイトルへ' : '何かキーを押すとタイトルへ', W/2, 500, 14, '#cfe8ff','center',4);
    ctx.globalAlpha = 1;
  }
}

const ENDING_TEXT = [
  '',
  '最終要塞オメガ ─ 撃破',
  '',
  '長きにわたる侵攻はここに終わった。',
  '崩れゆく要塞を背に、機体は',
  '静かに青い星へと機首を向ける。',
  '',
  '君の帰る場所は、まだそこにある。',
  '',
  '',
  '─ STELLAR ASSAULT ─',
  '',
  'ALL STAGE CLEAR!',
  '',
  'おめでとう！',
  ''
];
function drawEnding(){
  ctx.fillStyle='#02030a'; ctx.fillRect(0,0,W,H);
  for (const s of stars){
    ctx.globalAlpha = clamp(s.z/3.2,0.2,1);
    ctx.fillStyle = s.z>2.4 ? '#fff' : '#8fb8ff';
    ctx.fillRect(s.x,s.y,1,1);
  }
  ctx.globalAlpha=1;
  // 帰還する自機
  const shipY = H - 90 - Math.min(110, endT*0.12);
  for (const p of players){
    if (!p.playing) continue;
    const px = p.id===0 ? (playingCount()>1 ? W/2-40 : W/2) : W/2+40;
    ctx.save(); ctx.translate(px, shipY);
    ctx.globalCompositeOperation='lighter';
    const g = ctx.createLinearGradient(0,8,0,30);
    g.addColorStop(0,p.col); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(-5,8); ctx.lineTo(5,8); ctx.lineTo(0,30+Math.random()*10); ctx.closePath(); ctx.fill();
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='#e8f2ff';
    ctx.beginPath(); ctx.moveTo(0,-17); ctx.lineTo(6,-2); ctx.lineTo(5,10); ctx.lineTo(-5,10); ctx.lineTo(-6,-2); ctx.closePath(); ctx.fill();
    ctx.fillStyle=p.col2;
    ctx.beginPath(); ctx.moveTo(-6,-1); ctx.lineTo(-19,9); ctx.lineTo(-17,13); ctx.lineTo(-5,10); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(6,-1); ctx.lineTo(19,9); ctx.lineTo(17,13); ctx.lineTo(5,10); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  // スクロールテキスト（スコア表示が出る前にフェードアウト）
  const textAlpha = clamp((940 - endT)/70, 0, 1);
  if (textAlpha > 0){
    ctx.globalAlpha = textAlpha;
    const base = H + 40 - endT*0.62;
    for (let i=0;i<ENDING_TEXT.length;i++){
      const y = base + i*30;
      if (y < -20 || y > H+20) continue;
      const big = ENDING_TEXT[i].indexOf('STELLAR')>=0 || ENDING_TEXT[i].indexOf('ALL STAGE')>=0;
      txtOutline(ENDING_TEXT[i], W/2, y, big?20:14, big?'#ffd83d':'#cfe8ff', 'center', 4);
    }
    ctx.globalAlpha = 1;
  }
  // 最終スコア
  if (endT > 900){
    const a = clamp((endT-900)/50, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle='rgba(0,6,16,0.82)'; ctx.fillRect(40, 170, W-80, 210);
    ctx.strokeStyle='rgba(127,216,255,0.5)'; ctx.lineWidth=2; ctx.strokeRect(40,170,W-80,210);
    txtOutline('FINAL SCORE', W/2, 212, 20, '#7fd8ff','center',4);
    let y = 258;
    for (const p of players){
      if (!p.playing) continue;
      txtOutline((p.id+1)+'P  ' + pad(p.score,8), W/2, y, 18, p.col, 'center', 4);
      y += 34;
    }
    txtOutline('コンティニュー：' + totalContinues + '回', W/2, y+8, 13, '#9fc4e8','center',4);
    const rank = totalContinues===0 ? 'S ─ 完全撃破！' : (totalContinues<=3 ? 'A ─ 見事な腕前' : 'B ─ 生還');
    txtOutline('評価：' + rank, W/2, y+34, 14, '#ffd83d','center',4);
    ctx.globalAlpha = 1;
    if (endT > 1030){
      ctx.globalAlpha = 0.5+0.5*Math.sin(gameFrame*0.09);
      txtOutline(Pad.on ? '何かキー／パッドのボタンでタイトルへ' : '何かキーを押すとタイトルへ', W/2, 470, 13, '#cfe8ff','center',4);
      ctx.globalAlpha = 1;
    }
  }
}

/* ============================================================
   13. メインループ
   ============================================================ */
let last = performance.now(), acc = 0;
const STEP = 1000/60;

function frame(now){
  requestAnimationFrame(frame);
  let dt = now - last; last = now;
  if (dt > 250) dt = 250;
  acc += dt;
  let steps = 0;
  while (acc >= STEP && steps < 4){ update(); acc -= STEP; steps++; }
  if (acc > STEP*4) acc = 0;
  render();
}

function update(){
  gameFrame++;
  Pad.poll();
  if (sfxShotCd > 0) sfxShotCd--;
  Bgm.update();

  // 共通トグル
  if (hit(['KeyM'])){ menuSound = !menuSound; setSound(menuSound); }
  if (state === 'play' || state === 'warning'){
    if (hit(['KeyP','Escape']) || Pad.hit(PAD_START)) paused = !paused;
  }

  if (paused){ edge.clear(); return; }

  switch (state){
    case 'title': updateTitle(); break;

    case 'intro':
      introT++;
      updateBG();
      updateShots(); updateItems(); updateParticles();
      for (const p of players) updatePlayer(p);
      if (introT > 160){ state = 'play'; }
      break;

    case 'play': updatePlay(); break;

    case 'warning':
      warnT++;
      updateBG();
      updateShots(); updateItems(); updateParticles();
      for (const p of players){ updatePlayer(p); playerHitCheck(p); }
      if (warnT === 60) SFX.warn();
      if (warnT > 150){
        boss = makeBoss(BOSSES[stageIndex]);
        state = 'play';
      }
      break;

    case 'clear':
      clearT++;
      updateBG(); updateShots(); updateItems(); updateParticles();
      for (const p of players) updatePlayer(p);
      if (clearT > 190){
        if (stageIndex + 1 < 5){ startStage(stageIndex+1); }
        else { state = 'ending'; endT = 0; Bgm.play('ending'); }
      }
      break;

    case 'gameover':
      overT++;
      updateParticles();
      if (overT > 100 && anyHit()){ state='title'; menuSel=3; Bgm.stop(); Bgm.play('title'); clearField(); }
      break;

    case 'ending':
      endT++;
      for (const s of stars){ s.y += s.z*1.4; if (s.y>H){ s.y=-2; s.x=rand(0,W); } }
      if (endT > 1030 && anyHit()){ state='title'; menuSel=3; clearField(); }
      break;
  }
  edge.clear();
  anyKeyThisFrame = false;
}

function render(){
  ctx.save();
  if (shake > 0.4) ctx.translate(rand(-shake,shake), rand(-shake,shake));

  if (state === 'title'){
    drawTitle();
  } else if (state === 'ending'){
    drawEnding();
  } else {
    drawBG(stageIndex);
    // 自機・敵・弾を見やすくするため背景を少し暗く落とす
    ctx.fillStyle = 'rgba(0,3,10,' + (STAGES[stageIndex].dim || 0) + ')';
    ctx.fillRect(0,0,W,H);
    drawItems();
    for (const e of enemies) e.k.draw(e);
    drawBoss();
    drawBeams();
    drawShots();
    for (const p of players) drawPlayer(p);
    drawParticles();
    drawHUD();

    if (state === 'intro')   drawIntro();
    if (state === 'warning') drawWarning();
    if (state === 'clear')   drawClear();
    if (state === 'gameover')drawGameOver();
  }
  ctx.restore();

  // 画面フラッシュ
  if (flash > 0){
    ctx.globalAlpha = clamp(flash,0,1)*0.6;
    ctx.fillStyle = flashCol; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = 1;
  }
  // ポーズ
  if (paused){
    ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,W,H);
    txtOutline('PAUSE', W/2, H/2-6, 34, '#ffd83d', 'center', 5);
    txtOutline(Pad.on ? 'Pキー / START で再開' : 'Pキーで再開', W/2, H/2+28, 14, '#cfe8ff', 'center', 4);
  }
  // 走査線
  ctx.globalAlpha = 0.055; ctx.fillStyle='#000';
  for (let y=0;y<H;y+=3) ctx.fillRect(0,y,W,1);
  ctx.globalAlpha = 1;
}

requestAnimationFrame(frame);

})();

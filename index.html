<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STELLAR ASSAULT - Vertical Shooter</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    width:100%; height:100%; background:#05060c; overflow:hidden;
    font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
    color:#8fa;
  }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  /* ドット絵レイヤー（192x256）と、日本語テキスト用の高解像度レイヤーを重ねる */
  #stage {
    position:relative; width:192px; height:256px;
    transform-origin:center center;
    box-shadow:0 0 40px rgba(60,140,255,.35), 0 0 0 1px #1a2740;
    background:#000;
  }
  #cv { position:absolute; left:0; top:0; width:192px; height:256px; display:block; }
  #cv { image-rendering:pixelated; image-rendering:crisp-edges; }
  #hint {
    position:fixed; left:8px; bottom:6px; font-size:11px; color:#3a4a66;
    letter-spacing:.04em; pointer-events:none; user-select:none;
  }
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv" width="192" height="256"></canvas></div></div>
<div id="hint">1P: WASD / SPACE=SHOT / Q=BOMB (gamepad supported) &nbsp; 2P: ARROWS / ENTER=SHOT / SLASH=BOMB &nbsp; P=PAUSE / ESC=TITLE / M=SOUND</div>
<script>
'use strict';
(function () {

/* ============================================================
   0. 基本設定・ユーティリティ
   ============================================================ */
/* ゲームロジックの座標系は 480x640 のまま。
   画面はその 1/2.5 の 192x256 のドット絵バッファに描き、
   CSS のニアレストネイバー拡大で「大きなドット」として表示する。
   文字はすべて自作の 5x7 ドットフォント。 */
const W = 480, H = 640;
const PIXEL = 2.5;                       // ゲーム座標 → ドット
const PW = W / PIXEL | 0, PH = H / PIXEL | 0;   // 192 x 256
const TAU = Math.PI * 2;
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d', { alpha:false });
const stage = document.getElementById('stage');
ctx.imageSmoothingEnabled = false;

const dot = v => v / PIXEL;              // ゲーム座標 → ドット座標
const dotI = v => Math.round(v / PIXEL); // 〃（整数に丸める）

const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const rand  = (a,b) => a + Math.random()*(b-a);
const rint  = (a,b) => Math.floor(a + Math.random()*(b-a+1));
const pick  = arr => arr[Math.floor(Math.random()*arr.length)];
const hyp   = (x,y) => Math.sqrt(x*x+y*y);
function angDiff(a,b){ let d=(b-a)%TAU; if(d> Math.PI) d-=TAU; if(d<-Math.PI) d+=TAU; return d; }
// 点 → 半直線 の距離（レーザー判定用）
function distToRay(px,py,x,y,ang,len){
  const dx=Math.cos(ang), dy=Math.sin(ang);
  let t=(px-x)*dx+(py-y)*dy; t=clamp(t,0,len);
  return hyp(px-(x+dx*t), py-(y+dy*t));
}

// 画面サイズに合わせて拡大
function fit(){
  // 整数倍を優先してドットの大きさを揃える（入りきらない時だけ小数倍）
  const raw = Math.min(window.innerWidth/PW, window.innerHeight/PH);
  const s = raw >= 2 ? Math.floor(raw) : raw;
  stage.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit); fit();

/* ============================================================
   0.5 ドット絵の基盤（スプライト・ドットフォント・図形）
   すべて 192x256 のドット座標で整数に揃えて描くので、
   アンチエイリアスが入らず 1ドットがそのまま見える。
   ============================================================ */

// --- 文字列の配列からスプライトを焼く。1文字 = 1ドット、'.' と ' ' は透明 ---
function spr(rows, pal){
  const w = rows[0].length, h = rows.length;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  for (let y = 0; y < h; y++){
    const row = rows[y];
    for (let x = 0; x < w; x++){
      const col = pal[row[x]];
      if (col){ g.fillStyle = col; g.fillRect(x, y, 1, 1); }
    }
  }
  return c;
}
// スプライトの色だけを差し替えた複製を作る（1P→2P など）
function recolor(rows, pal, swap){
  const p2 = Object.assign({}, pal);
  for (const k in swap) p2[k] = swap[k];
  return spr(rows, p2);
}
// 中心を (cx,cy)（ドット座標）に置いて描く
function blit(s, cx, cy){
  ctx.drawImage(s, Math.round(cx - s.width/2), Math.round(cy - s.height/2));
}
// 横幅を変えて描く（バンク用）。1ドット未満にならないよう丸める
function blitW(s, cx, cy, w){
  const ww = Math.max(1, Math.round(w));
  ctx.drawImage(s, Math.round(cx - ww/2), Math.round(cy - s.height/2), ww, s.height);
}
// --- 整数の図形。すべてドット座標 ---
function rct(x, y, w, h, col){
  ctx.fillStyle = col;
  ctx.fillRect(Math.round(x), Math.round(y), Math.max(1,Math.round(w)), Math.max(1,Math.round(h)));
}
function pset(x, y, col){ ctx.fillStyle = col; ctx.fillRect(Math.round(x), Math.round(y), 1, 1); }
// 塗りつぶし円（走査線ごとに整数の横棒を引く＝ドット絵の円）
function disc(cx, cy, r, col){
  cx = Math.round(cx); cy = Math.round(cy); r = Math.round(r);
  ctx.fillStyle = col;
  for (let y = -r; y <= r; y++){
    const w = Math.floor(Math.sqrt(Math.max(0, r*r - y*y)) + 0.5);
    if (w > 0) ctx.fillRect(cx - w, cy + y, w*2, 1);
  }
}
function oval(cx, cy, rx, ry, col){
  cx = Math.round(cx); cy = Math.round(cy); rx = Math.round(rx); ry = Math.round(ry);
  if (rx < 1 || ry < 1) return;
  ctx.fillStyle = col;
  for (let y = -ry; y <= ry; y++){
    const w = Math.floor(rx * Math.sqrt(Math.max(0, 1 - (y*y)/(ry*ry))) + 0.5);
    if (w > 0) ctx.fillRect(cx - w, cy + y, w*2, 1);
  }
}
function bands(cols){        // 画面を色の帯で塗る（ドット絵らしい階調）
  const n = cols.length, h = Math.ceil(PH / n);
  for (let i = 0; i < n; i++){ ctx.fillStyle = cols[i]; ctx.fillRect(0, i*h, PW, h); }
}
function ringDot(cx, cy, r, col){
  cx = Math.round(cx); cy = Math.round(cy);
  ctx.fillStyle = col;
  const n = Math.max(8, Math.round(r * 4));
  for (let i = 0; i < n; i++){
    const a = i * TAU / n;
    ctx.fillRect(Math.round(cx + Math.cos(a)*r), Math.round(cy + Math.sin(a)*r), 1, 1);
  }
}

// --- 5x7 のドットフォント（英数字と記号） ---
const GLYPH = {
  ' ':'00000/00000/00000/00000/00000/00000/00000',
  '!':'00100/00100/00100/00100/00100/00000/00100',
  '%':'11001/11010/00010/00100/01000/01011/10011',
  "'":'01100/01100/00000/00000/00000/00000/00000',
  '(':'00010/00100/01000/01000/01000/00100/00010',
  ')':'01000/00100/00010/00010/00010/00100/01000',
  '*':'00000/10101/01110/11111/01110/10101/00000',
  '+':'00000/00100/00100/11111/00100/00100/00000',
  ',':'00000/00000/00000/00000/01100/01100/11000',
  '-':'00000/00000/00000/11111/00000/00000/00000',
  '.':'00000/00000/00000/00000/00000/01100/01100',
  '/':'00001/00010/00010/00100/01000/01000/10000',
  '0':'01110/10001/10011/10101/11001/10001/01110',
  '1':'00100/01100/00100/00100/00100/00100/01110',
  '2':'01110/10001/00001/00010/00100/01000/11111',
  '3':'11111/00010/00100/00010/00001/10001/01110',
  '4':'00010/00110/01010/10010/11111/00010/00010',
  '5':'11111/10000/11110/00001/00001/10001/01110',
  '6':'00110/01000/10000/11110/10001/10001/01110',
  '7':'11111/00001/00010/00100/01000/01000/01000',
  '8':'01110/10001/10001/01110/10001/10001/01110',
  '9':'01110/10001/10001/01111/00001/00010/01100',
  ':':'00000/01100/01100/00000/01100/01100/00000',
  '<':'00010/00100/01000/10000/01000/00100/00010',
  '=':'00000/00000/11111/00000/11111/00000/00000',
  '>':'01000/00100/00010/00001/00010/00100/01000',
  '?':'01110/10001/00001/00010/00100/00000/00100',
  'A':'01110/10001/10001/11111/10001/10001/10001',
  'B':'11110/10001/10001/11110/10001/10001/11110',
  'C':'01110/10001/10000/10000/10000/10001/01110',
  'D':'11110/10001/10001/10001/10001/10001/11110',
  'E':'11111/10000/10000/11110/10000/10000/11111',
  'F':'11111/10000/10000/11110/10000/10000/10000',
  'G':'01110/10001/10000/10111/10001/10001/01111',
  'H':'10001/10001/10001/11111/10001/10001/10001',
  'I':'11111/00100/00100/00100/00100/00100/11111',
  'J':'00111/00010/00010/00010/00010/10010/01100',
  'K':'10001/10010/10100/11000/10100/10010/10001',
  'L':'10000/10000/10000/10000/10000/10000/11111',
  'M':'10001/11011/10101/10101/10001/10001/10001',
  'N':'10001/11001/10101/10011/10001/10001/10001',
  'O':'01110/10001/10001/10001/10001/10001/01110',
  'P':'11110/10001/10001/11110/10000/10000/10000',
  'Q':'01110/10001/10001/10001/10101/10010/01101',
  'R':'11110/10001/10001/11110/10100/10010/10001',
  'S':'01111/10000/10000/01110/00001/00001/11110',
  'T':'11111/00100/00100/00100/00100/00100/00100',
  'U':'10001/10001/10001/10001/10001/10001/01110',
  'V':'10001/10001/10001/10001/10001/01010/00100',
  'W':'10001/10001/10001/10101/10101/11011/10001',
  'X':'10001/10001/01010/00100/01010/10001/10001',
  'Y':'10001/10001/01010/00100/00100/00100/00100',
  'Z':'11111/00001/00010/00100/01000/10000/11111',
};
const GLYPH_CACHE = {};
function glyphRows(ch){
  let g = GLYPH_CACHE[ch];
  if (!g){ g = GLYPH_CACHE[ch] = (GLYPH[ch] || GLYPH['?']).split('/'); }
  return g;
}
const FW = 5, FH = 7;
function textW(str, sc){ return str.length * (FW + 1) * sc - sc; }
// ドット座標に英数字を描く。sc は 1 ドットの大きさ、sh を渡すと影がつく
function dtext(str, x, y, col, align, sc, sh){
  sc = sc || 1;
  str = String(str).toUpperCase();
  const w = textW(str, sc);
  let sx = align === 'center' ? Math.round(x - w/2) : (align === 'right' ? Math.round(x - w) : Math.round(x));
  sx = Math.round(sx); y = Math.round(y);
  for (let pass = sh ? 0 : 1; pass < 2; pass++){
    ctx.fillStyle = pass === 0 ? sh : col;
    const ox = pass === 0 ? sc : 0, oy = pass === 0 ? sc : 0;
    let cx = sx;
    for (let i = 0; i < str.length; i++){
      const rows = glyphRows(str[i]);
      for (let ry = 0; ry < FH; ry++){
        const line = rows[ry];
        for (let rx = 0; rx < FW; rx++){
          if (line[rx] === '1') ctx.fillRect(cx + rx*sc + ox, y + ry*sc + oy, sc, sc);
        }
      }
      cx += (FW + 1) * sc;
    }
  }
}

// --- 敵弾の玉。色ごとにスプライトを焼いてキャッシュする（6ドット / 大きい弾は8ドット） ---
const BALL6 = ['.####.','#%%%%#','#%00%#','#%00%#','#%%%%#','.####.'];
const BALL8 = ['..####..','.#%%%%#.','#%%%%%%#','#%%00%%#','#%%00%%#','#%%%%%%#','.#%%%%#.','..####..'];
const BALL_CACHE = new Map();
function ballSpr(col, core, big){
  const key = (big ? '8' : '6') + col + core;
  let c = BALL_CACHE.get(key);
  if (!c){
    c = spr(big ? BALL8 : BALL6, {'#':'#080c14', '%':col, '0':core || '#ffffff'});
    BALL_CACHE.set(key, c);
  }
  return c;
}

// スプライトを真っ白にした複製（被弾フラッシュ用）
function whiteOf(src){
  const c = document.createElement('canvas');
  c.width = src.width; c.height = src.height;
  const g = c.getContext('2d');
  g.drawImage(src, 0, 0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height);
  return c;
}

/* --- ドット絵スプライト定義（art/pixel/ で設計） --- */
const PAL_SHIP = {'3':'#1a2432','2':'#5c7590','1':'#d8e6f2','0':'#ffffff','4':'#2a6fd0','5':'#17427f','6':'#4ff0ff','7':'#ffcf4a'};
const ROWS_SHIP = ['.......11.......','.......11.......','......2112......','......1111......','.....216612.....','.....216612.....','.....211112.....','...2221111222...','..244411114442..','.24444111144442.','.24455111155442.','..22.511115.22..','.....211112.....','.....231132.....','.....273372.....','......7..7......'];
const SP = {};
SP.ship1 = spr(ROWS_SHIP, PAL_SHIP);
SP.ship2 = recolor(ROWS_SHIP, PAL_SHIP, {'4':'#e0741c','5':'#8a3d08','6':'#ffd24a'});
SP.pop = spr(['..........','..caaaac..','.caaaaaac.','caaaddaaac','caabddbaac','.cabbbbac.','..cabbac..','...cbbc...','....cc....','..........'], {'a':'#ff9a5c','b':'#c2551f','c':'#40200f','d':'#ffe6a8','e':'#9fb4c9'});
SP.zig = spr(['............','..ccaaaacc..','.caaaaaaaac.','caaaaddaaaac','caabbddbbaac','caabbddbbaac','c.cabbbbac.c','cc.cabbac.cc','..ccabbacc..','...cabbac...','....cbbc....','.....cc.....'], {'a':'#8affd1','b':'#2c9c76','c':'#0d3328','d':'#eafff6','e':'#9fb4c9'});
SP.dive = spr(['...cc..cc...','..caaaaaac..','.caaaaaaaac.','caaaaddaaaac','caaddddddaac','caaaaddaaaac','caaaabbaaaac','.cabbbbbbac.','..cabbbbac..','...cabbac...','....cbbc....','.....cc.....'], {'a':'#ffd45c','b':'#b8842a','c':'#3d2a08','d':'#fff4c8','e':'#9fb4c9'});
SP.sniper = spr(['.....cc.....','....caac....','...caaaac...','..caaaaaac..','.caaaddaaac.','caaaaddaaaac','caaaabbaaaac','c.caabbaac.c','cc.cabbac.cc','...cabbac...','...ccbbcc...','.....cc.....'], {'a':'#c98aff','b':'#6a3aa8','c':'#251038','d':'#f0dcff','e':'#9fb4c9'});
SP.mine = spr(['..c.cc.c..','..caccac..','.ccaccacc.','ccaaaaaacc','.caaddaac.','.caaddaac.','ccaaaaaacc','.ccaccacc.','..caccac..','..c.cc.c..'], {'a':'#ffe066','b':'#a87f18','c':'#3a2c05','d':'#ff6a3b','e':'#9fb4c9'});
SP.turret = spr(['....cc..cc....','..cceeeeeecc..','.ceeeeeeeeeec.','.ceeaaaaaaeec.','ceeaaaaaaaaeec','ceaaaddddaaaec','ceaaddddddaaec','ceaaddddddaaec','ceaaaaddaaaaec','ceeaaaaaaaaeec','.ceeaaaaaaeec.','.cceeeeeeeecc.','..cceeeeeecc..','....cc..cc....'], {'a':'#9fd8ff','b':'#3f6f96','c':'#10202e','d':'#ffe066','e':'#7f9bb5'});
SP.carrier = spr(['...cccccccccccccc...','..ceeeeeeeeeeeeeec..','.ceeaaaaaaaaaaaaeec.','ceeaaaaaaaaaaaaaaeec','ceaaaddaaaaaaddaaaec','ceaaaddaaaaaaddaaaec','ceaaaaaaaaaaaaaaaaec','ceaabbbbaaaabbbbaaec','ceaabbbbaaaabbbbaaec','ceaaaaaaaaaaaaaaaaec','ceaaddddaaaaddddaaec','ceaaaaaaaaaaaaaaaaec','.ceeaaaaaaaaaaaaeec.','..cceeeeeeeeeeeecc..','...cccccccccccccc...','.....cccccccccc.....'], {'a':'#7fa8ff','b':'#2b4f96','c':'#0c1830','d':'#ffd166','e':'#5c78a8'});
SP.heavy = spr(['.....cccccccc.....','...cceeeeeeeecc...','..ceeaaaaaaaaeec..','.ceaaaaaaaaaaaaec.','ceaaaaddddddaaaaec','ceaaaaddddddaaaaec','ceaaaaaaaaaaaaaaec','ceaabbbbaabbbbaaec','ceaabbbbaabbbbaaec','ceaaaaaaaaaaaaaaec','.ceaaddaaaaddaaec.','.ceaaddaaaaddaaec.','..cceaaaaaaaaecc..','...cceeaaaaeecc...','.....cceeeecc.....','.......cccc.......'], {'a':'#ff8fa8','b':'#a03c58','c':'#340f1c','d':'#fff0a8','e':'#c26a7c'});
// 被弾時に光らせる白抜き版
for (const k of Object.keys(SP)) SP[k + 'W'] = whiteOf(SP[k]);
/* ============================================================
   1. 入力
   ============================================================ */
const P1KEY = {
  up:['KeyW'], down:['KeyS'], left:['KeyA'], right:['KeyD'],
  shot:['Space'], bomb:['KeyQ','ShiftLeft']
};
const P2KEY = {
  up:['ArrowUp'], down:['ArrowDown'], left:['ArrowLeft'], right:['ArrowRight'],
  shot:['Enter','Numpad0','NumpadEnter'], bomb:['Slash','ShiftRight','NumpadDecimal']
};
const BLOCK = new Set([
  'Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Slash','Enter',
  'Numpad0','NumpadDecimal','KeyW','KeyA','KeyS','KeyD','KeyQ','Tab'
]);

const held = new Set();
const edge = new Set();      // このフレームで押された
let anyKeyThisFrame = false;

window.addEventListener('keydown', e => {
  if (BLOCK.has(e.code)) e.preventDefault();
  if (!e.repeat) { edge.add(e.code); anyKeyThisFrame = true; }
  held.add(e.code);
  initAudio();
});
window.addEventListener('keyup',  e => { held.delete(e.code); });
window.addEventListener('blur',   () => { held.clear(); if (state==='play') paused = true; });

const down = list => list.some(k => held.has(k));
const hit  = list => list.some(k => edge.has(k));

/* --- ゲームパッド（1P用） -------------------------------------------------
   標準マッピング（Xbox / PS / Switch Pro など）を想定。
   ショット: A・X・R1・R2 ／ ボム: B・Y・L1・L2 ／ 一時停止: START
   移動: 左スティック（アナログ）＋ 十字キー                                */
const PAD_SHOT  = [0,2,5,7];
const PAD_BOMB  = [1,3,4,6];
const PAD_START = [9];
const PAD_HOME  = [8,16];   // SELECT / BACK / ホームボタン
const DEADZONE  = 0.24;

const Pad = {
  on:false, name:'', btn:[], prev:[], ax:[0,0],
  nav:{x:0,y:0}, navPrev:{x:0,y:0},
  poll(){
    const list = navigator.getGamepads ? navigator.getGamepads() : null;
    let gp = null;
    if (list) for (let i=0;i<list.length;i++){
      const g = list[i];
      if (g && g.connected && g.buttons && g.buttons.length){ gp = g; break; }
    }
    this.prev = this.btn;
    this.navPrev = this.nav;
    if (!gp){ this.on=false; this.name=''; this.btn=[]; this.ax=[0,0]; this.nav={x:0,y:0}; return; }
    this.on = true; this.name = gp.id;
    this.btn = gp.buttons.map(b => b.pressed || b.value > 0.4);
    this.ax  = [gp.axes[0]||0, gp.axes[1]||0];
    // メニュー用に方向をデジタル化（十字キーとスティックの両方）
    let nx = this.ax[0], ny = this.ax[1];
    if (this.btn[14]) nx = -1; if (this.btn[15]) nx = 1;
    if (this.btn[12]) ny = -1; if (this.btn[13]) ny = 1;
    this.nav = { x: nx>0.55?1:(nx<-0.55?-1:0), y: ny>0.55?1:(ny<-0.55?-1:0) };
    // パッドのボタンが押されたらサウンドの初期化も試みる
    if (this.btn.some((b,i) => b && !this.prev[i])) initAudio();
  },
  down(list){ return this.on && list.some(i => this.btn[i]); },
  hit(list){  return this.on && list.some(i => this.btn[i] && !this.prev[i]); },
  anyHit(){   return this.on && this.btn.some((b,i) => b && !this.prev[i]); },
  // 移動ベクトル（デッドゾーン処理つき）
  move(){
    if (!this.on) return {x:0,y:0};
    let x = this.ax[0], y = this.ax[1];
    const d = Math.hypot(x,y);
    if (d < DEADZONE) { x = 0; y = 0; }
    else { const k = Math.min(1,(d-DEADZONE)/(0.95-DEADZONE))/d; x*=k; y*=k; }
    if (this.btn[14]) x = -1; if (this.btn[15]) x = 1;
    if (this.btn[12]) y = -1; if (this.btn[13]) y = 1;
    return {x,y};
  },
  navUp(){    return this.nav.y===-1 && this.navPrev.y!==-1; },
  navDown(){  return this.nav.y=== 1 && this.navPrev.y!== 1; },
  navLeft(){  return this.nav.x===-1 && this.navPrev.x!==-1; },
  navRight(){ return this.nav.x=== 1 && this.navPrev.x!== 1; }
};
window.addEventListener('gamepadconnected', () => initAudio());

const anyHit = () => edge.size > 0 || Pad.anyHit();
// 1P はキーボードとゲームパッドのどちらでも操作できる
const pDown = (p, act) => down(playerKeys(p)[act]) ||
  (p.id===0 && (act==='shot' ? Pad.down(PAD_SHOT) : false));
const pHit  = (p, act) => hit(playerKeys(p)[act]) ||
  (p.id===0 && (act==='shot' ? Pad.hit(PAD_SHOT) : act==='bomb' ? Pad.hit(PAD_BOMB) : false));

/* ============================================================
   2. サウンド（WebAudio 合成・外部ファイル不要）
   ============================================================ */
let actx = null, masterGain = null, sfxGain = null, bgmGain = null, noiseBuf = null;
let soundOn = true;

function initAudio(){
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    masterGain = actx.createGain(); masterGain.gain.value = 0.7; masterGain.connect(actx.destination);
    sfxGain = actx.createGain(); sfxGain.gain.value = 0.55; sfxGain.connect(masterGain);
    bgmGain = actx.createGain(); bgmGain.gain.value = 0.30; bgmGain.connect(masterGain);
    const n = actx.sampleRate * 1.0;
    noiseBuf = actx.createBuffer(1, n, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = Math.random()*2-1;
  } catch(e){ actx = null; }
}
function setSound(on){
  soundOn = on;
  if (masterGain) masterGain.gain.value = on ? 0.7 : 0.0;
}
function tone(freq, dur, type, vol, slideTo){
  if (!actx || !soundOn) return;
  const t0 = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0+dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(0.01, dur*0.2));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(sfxGain);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noiseHit(dur, vol, f0, f1, q){
  if (!actx || !soundOn || !noiseBuf) return;
  const t0 = actx.currentTime;
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const bp = actx.createBiquadFilter(); bp.type='lowpass';
  bp.frequency.setValueAtTime(f0, t0);
  bp.frequency.exponentialRampToValueAtTime(Math.max(40,f1), t0+dur);
  bp.Q.value = q || 1;
  const g = actx.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  s.connect(bp); bp.connect(g); g.connect(sfxGain);
  s.start(t0); s.stop(t0+dur+0.02);
}
let sfxShotCd = 0;
const SFX = {
  shot(){ if (sfxShotCd>0) return; sfxShotCd = 3; tone(1400, 0.05, 'square', 0.05, 700); },
  eshot(){ tone(300, 0.06, 'sawtooth', 0.025, 190); },
  hit(){ noiseHit(0.04, 0.06, 3800, 900); },
  pop(){ noiseHit(0.18, 0.16, 2200, 200); tone(240,0.14,'square',0.05,80); },
  big(){ noiseHit(0.55, 0.30, 1500, 60, 0.7); tone(150,0.4,'sawtooth',0.10,40); },
  huge(){ noiseHit(1.1, 0.40, 1100, 40, 0.8); tone(90,0.9,'sawtooth',0.14,30); },
  power(){ [0,1,2,3].forEach(i => setTimeout(()=>tone(660*Math.pow(2,i/6), 0.10,'square',0.09), i*45)); },
  bombitem(){ [0,1,2].forEach(i => setTimeout(()=>tone(440*Math.pow(2,i/4), 0.12,'triangle',0.10), i*55)); },
  extend(){ [0,2,4,7,12].forEach((n,i)=> setTimeout(()=>tone(523.25*Math.pow(2,n/12),0.14,'square',0.10), i*70)); },
  bomb(){ noiseHit(0.9, 0.35, 4000, 80, 0.9); tone(500,0.7,'sawtooth',0.12,60); },
  death(){ noiseHit(0.7, 0.28, 2000, 50); tone(400,0.6,'sawtooth',0.12,50); },
  warn(){ tone(880,0.18,'square',0.10); setTimeout(()=>tone(660,0.22,'square',0.10),200); },
  menu(){ tone(880, 0.05,'square',0.07); },
  ok(){ tone(660,0.07,'square',0.09); setTimeout(()=>tone(990,0.11,'square',0.09),70); },
  laser(){ tone(180,0.5,'sawtooth',0.06,900); }
};

const TRACKS = {
  title : {bpm:126, chords:[[57,60,64],[53,57,60],[55,59,62],[57,60,64]], lead:[0,-1,2,-1,4,-1,2,3, 1,-1,3,-1,5,-1,-1,-1], drum:0},

  ending: {bpm:104, chords:[[53,57,60],[55,59,62],[57,60,64],[52,55,59]], lead:[3,-1,4,-1,5,-1,4,3, 2,-1,3,-1,4,-1,-1,-1], drum:0}
};
const BASSPAT = [1,0,0,1,0,0,1,0, 1,0,0,1,0,1,0,0];
const mid2f = m => 440 * Math.pow(2, (m-69)/12);

const Bgm = {
  name:null, step:0, next:0,
  play(n){ if (this.name===n) return; this.name=n; this.step=0; if(actx) this.next = actx.currentTime + 0.05; },
  stop(){ this.name=null; },
  update(){
    if (!actx || !this.name || !soundOn) return;
    const tr = TRACKS[this.name]; if (!tr) return;
    const spb = 60/tr.bpm/4;
    if (this.next < actx.currentTime) this.next = actx.currentTime + 0.02;
    let guard = 0;
    while (this.next < actx.currentTime + 0.15 && guard++ < 64) {
      this.tick(tr, this.step, this.next);
      this.step = (this.step + 1) % (16 * tr.chords.length);
      this.next += spb;
    }
  },
  tick(tr, step, t){
    const bar = Math.floor(step/16) % tr.chords.length;
    const s = step % 16;
    const ch = tr.chords[bar];
    const ext = [ch[0], ch[1], ch[2], ch[0]+12, ch[1]+12, ch[2]+12];
    // ベース
    if (BASSPAT[s]) this.note(mid2f(ch[0]-12), t, 0.13, 'square', 0.16);
    // リード
    const li = tr.lead[s];
    if (li >= 0) this.note(mid2f(ext[li]+12), t, 0.15, 'square', 0.085);
    // ハーモニー（拍頭）
    if (s % 8 === 0) this.note(mid2f(ch[1]), t, 0.30, 'triangle', 0.06);
    // ドラム
    if (tr.drum > 0) {
      if (s===0 || s===6 || s===8 || (tr.drum>1 && s===11)) this.drum(t, 'k');
      if (s===4 || s===12) this.drum(t, 's');
      if (tr.drum>1 && s%2===0) this.drum(t, 'h');
    }
  },
  note(f, t, dur, type, vol){
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(bgmGain); o.start(t); o.stop(t+dur+0.02);
  },
  drum(t, kind){
    if (kind === 'k') {
      const o=actx.createOscillator(), g=actx.createGain();
      o.type='sine'; o.frequency.setValueAtTime(150,t);
      o.frequency.exponentialRampToValueAtTime(45,t+0.11);
      g.gain.setValueAtTime(0.30,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.13);
      o.connect(g); g.connect(bgmGain); o.start(t); o.stop(t+0.15);
    } else {
      const s=actx.createBufferSource(); s.buffer=noiseBuf;
      const f=actx.createBiquadFilter();
      f.type = kind==='s' ? 'bandpass' : 'highpass';
      f.frequency.value = kind==='s' ? 1800 : 7000;
      const g=actx.createGain();
      const v = kind==='s' ? 0.16 : 0.045, d = kind==='s' ? 0.13 : 0.035;
      g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      s.connect(f); f.connect(g); g.connect(bgmGain); s.start(t); s.stop(t+d+0.02);
    }
  }
};

/* ============================================================
   3. エフェクト（パーティクル・画面揺れ）
   ============================================================ */
let particles = [];
let shake = 0, flash = 0, flashCol = '#fff';

function spark(x,y,n,col,spd,life,size){
  for (let i=0;i<n;i++){
    if (particles.length > 900) break;
    const a = rand(0,TAU), s = rand(spd*0.25, spd);
    particles.push({x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
      life:rand(life*0.5,life), max:life, col, size:size||2.4, drag:0.94, glow:true});
  }
}
function boom(x,y,scale,col){
  scale = scale || 1;
  spark(x,y, Math.min(40, 10+12*scale), col||'#ffd27a', 3.2*scale, 26*scale, 2.6*scale);
  spark(x,y, Math.min(24, 6+8*scale), '#fff', 2.0*scale, 16*scale, 1.8*scale);
  particles.push({x,y, vx:0,vy:0, life:14*Math.min(2,scale), max:14*Math.min(2,scale),
    col:'#fff', size:10*scale, drag:1, ring:true});
  shake = Math.min(18, shake + 2.5*scale);
}
function updateParticles(){
  for (let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    if (p.drag !== 1){ p.vx *= p.drag; p.vy *= p.drag; }
    p.life--;
    if (p.life <= 0) particles.splice(i,1);
  }
  if (shake > 0) shake = Math.max(0, shake - 0.6);
  if (flash > 0) flash = Math.max(0, flash - 0.06);
}
function drawParticles(){
  for (const p of particles){
    const k = p.life / p.max;
    const x = dot(p.x), y = dot(p.y);
    if (p.ring){
      ringDot(x, y, (p.size*(1.6-k)*2.0)/PIXEL, p.col);
    } else {
      const sz = k > 0.55 ? 2 : 1;
      rct(x - sz/2, y - sz/2, sz, sz, k > 0.75 ? '#ffffff' : p.col);
    }
  }
}

   4. 弾・アイテム

let pshots = [], eshots = [], items = [], beams = [];

// --- 自機弾 ---
function pshot(owner,x,y,vx,vy,dmg,type){
  if (pshots.length > 420) return;
  pshots.push({owner,x,y,vx,vy,dmg,type:type||'n',r:5,t:0,homeT:0});
}
// --- 敵弾 ---
function eshot(x,y,vx,vy,o){
  if (eshots.length > 1100) return;
  o = o || {};
  eshots.push({x,y,vx,vy, r:(o.r||5.5)*0.82, col:o.col||'#ff5ae0', core:o.core||'#fff',
    type:o.type||'ball', homing:o.homing||0, t:0, acc:o.acc||0, grz:false});
}
function eshotA(x,y,ang,sp,o){ eshot(x,y,Math.cos(ang)*sp,Math.sin(ang)*sp,o); }
function aimAng(x,y){
  const p = nearestPlayer(x,y);
  return p ? Math.atan2(p.y-y, p.x-x) : Math.PI/2;
}
// --- 弾密度の調整（面ごと。dens が小さいほど「弾が少なく・間隔が長い」）---
// fireAt: 発射間隔を dens で伸縮させる。cdens: 一度に撒く弾数を減らす。
function fireAt(t, period, off){
  const p = Math.max(1, Math.round(period / dens));
  return t % p === off % p;
}
function fan(x,y,ang,n,spread,sp,o){
  const m = Math.max(1, Math.round(n * cdens));
  const total = spread * (n-1);          // 弾数を減らしても扇の広がりは保つ
  const s = m > 1 ? total/(m-1) : 0;
  for (let i=0;i<m;i++) eshotA(x,y, ang + (i-(m-1)/2)*s, sp, o);
}
function ringShot(x,y,n,sp,off,o){
  const m = Math.max(5, Math.round(n * cdens));
  for (let i=0;i<m;i++) eshotA(x,y, off + i*TAU/m, sp, o);
}

// --- アイテム ---
const ITEM_COL = { P:'#ff4d6d', B:'#4dd2ff', S:'#ffd83d', U:'#7dff8a' };
function dropItem(x,y,type){

function supply(type,x){ items.push({x:clamp(x,20,W-20), y:-18, vx:0, vy:1.1, type, t:0}); }
function updateItems(){
  for (let i=items.length-1;i>=0;i--){
    const it = items[i];
    it.t++;
    it.vy = Math.min(1.5, it.vy + 0.045);
    it.x += it.vx; it.y += it.vy;
    if (it.x < 12) { it.x = 12; it.vx = Math.abs(it.vx); }
    if (it.x > W-12){ it.x = W-12; it.vx = -Math.abs(it.vx); }
    if (it.y > H + 24){ items.splice(i,1); continue; }
    for (const p of players){
      if (!p.playing) continue;
      // 吸い寄せ
      const dx = p.x-it.x, dy = p.y-it.y, d = hyp(dx,dy);
      if (d < 90){ it.x += dx/d*1.6; it.y += dy/d*1.6; }
      if (d < 22){ takeItem(p, it.type); items.splice(i,1); break; }
    }
  }
}
function takeItem(p, type){
  if (type === 'P'){
    if (p.power < MAX_POWER){ p.power++; SFX.power(); p.msg='POWER UP!'; p.msgT=70; }
    else { p.score += 3000; SFX.power(); }
  } else if (type === 'B'){
    if (p.bombs < 6){ p.bombs++; SFX.bombitem(); p.msg='BOMB +1'; p.msgT=70; }
    else p.score += 3000;
  } else if (type === 'S'){
    p.score += 500;
    tone(1200,0.04,'square',0.04,1600);
  } else if (type === 'U'){
    p.lives++; SFX.extend(); p.msg='1UP!'; p.msgT=100;
  }
}

    rct(x-4, y-4, 8, 8, blink ? c : '#16202c');  // 中身

/* ============================================================
   5. 自機
   ============================================================ */
function makePlayer(id){
  return {
    id, playing:false, alive:false,
    x: id===0 ? W/2-60 : W/2+60, y: H-90,
    lives:3, bombs:3, power:0, score:0, credits:0,
    inv:0, respawn:0, outWait:0, fireCd:0, missileCd:0, bank:0,
    bombT:0, msg:'', msgT:0, t:0, hitR:3.2,
    col: id===0 ? '#5fd8ff' : '#ffb15f',
    col2: id===0 ? '#1b6bff' : '#ff6a1b'
  };
}
let players = [makePlayer(0), makePlayer(1)];

function joinPlayer(p, firstTime){
  p.playing = true; p.alive = true;
  p.lives = firstTime ? 3 : 3;
  p.bombs = 3; p.power = 0;
  p.inv = 150; p.respawn = 0; p.outWait = 0;
  p.x = p.id===0 ? W/2-60 : W/2+60; p.y = H-90; p.bank = 0;
  if (!firstTime){ p.credits++; totalContinues++; }
  p.msg = 'GO!'; p.msgT = 60;
  // 参加人数が変わったら敵の耐久を調整
  hpScale = (1.0 + stageIndex*0.09) * (playingCount() > 1 ? 1.45 : 1.0);
}
function playerKeys(p){ return p.id===0 ? P1KEY : P2KEY; }

function nearestPlayer(x,y){
  let best=null, bd=1e9;
  for (const p of players){
    if (!p.playing || !p.alive) continue;
    const d = (p.x-x)*(p.x-x) + (p.y-y)*(p.y-y);
    if (d < bd){ bd=d; best=p; }
  }
  return best;
}
function anyPlayerAlive(){ return players.some(p => p.playing && p.alive); }

function updatePlayer(p){
  p.t++;
  if (p.msgT > 0) p.msgT--;

  // --- 未参加：途中参加受付 ---
  if (!p.playing){
    if ((state==='play'||state==='warning'||state==='intro') && pHit(p,'shot')){
      joinPlayer(p, true); SFX.ok();
    }
    return;
  }
  // --- 残機ゼロ：コンティニュー待ち ---
  if (p.lives < 0){
    p.outWait--;
    if (pHit(p,'shot')){ joinPlayer(p, false); SFX.ok(); }
    return;
  }
  // --- 復活待ち ---
  if (!p.alive){
    p.respawn--;
    if (p.respawn <= 0){
      p.alive = true; p.inv = 140; p.bank = 0;
      p.x = p.id===0 ? W/2-50 : W/2+50; p.y = H-70;
    }
    return;
  }

  if (p.inv > 0) p.inv--;
  if (p.bombT > 0) p.bombT--;

  const K = playerKeys(p);
  let dx = (down(K.right)?1:0) - (down(K.left)?1:0);
  let dy = (down(K.down)?1:0) - (down(K.up)?1:0);
  if (p.id === 0 && Pad.on){                 // 1P はゲームパッドでも移動できる
    const g = Pad.move();
    if (Math.abs(g.x) > Math.abs(dx)) dx = g.x;
    if (Math.abs(g.y) > Math.abs(dy)) dy = g.y;
  }
  const mag = Math.hypot(dx,dy);
  if (mag > 1){ dx /= mag; dy /= mag; }      // 斜め移動が速くならないように
  const sp = p.power >= 1 ? SPEED_FAST : SPEED_SLOW;
  const x0 = p.x;
  p.x = clamp(p.x + dx*sp, 14, W-14);
  p.y = clamp(p.y + dy*sp, 26, H-16);
  // バンク：実際に動いた量に応じて機体を傾ける（壁ぎわでは傾かない）
  const moved = (p.x - x0) / sp;
  p.bank += (clamp(moved, -1, 1) - p.bank) * BANK_EASE;

  // --- ショット ---
  if (p.fireCd > 0) p.fireCd--;
  if (p.missileCd > 0) p.missileCd--;
  if (pDown(p,'shot') && p.fireCd <= 0){
    firePlayer(p);
    // 間隔を 1/0.7 倍に伸ばす＝発射頻度は30%減。端数は繰り越して平均間隔を正確に保つ
    // 端数は繰り越して平均間隔を正確に保つ（撃たない間に貯め込まないよう -1 で止める）
    p.fireCd = Math.max(-1, p.fireCd) + (p.power >= 3 ? 5 : 6) / FIRE_FREQ;
  }

  // --- ボム ---
  if (pHit(p,'bomb') && p.bombs > 0 && p.bombT <= 0){
    p.bombs--; p.bombT = 150; p.inv = Math.max(p.inv, 165);
    doBomb(p);
  }
}

/* パワー段階（最大 P4）
   0: 中央レーザー1本
   1: ＋ 自機の移動速度アップ
   2: ＋ 直進ショット2発
   3: ＋ 斜めショット2発（連射も速くなる）
   4: 中央レーザー強化                          */
const MAX_POWER    = 4;
const FIRE_FREQ    = 0.7;   // ショットの発射頻度の倍率（1.0 が従来）
const BANK_EASE    = 0.16;  // バンクの追従の速さ
const BANK_TILT    = 0.20;  // 最大の傾き（ラジアン）
const BANK_SQUASH  = 0.30;  // 最大の横方向の縮み
const SPEED_SLOW   = 3.6;   // P0
const SPEED_FAST   = 4.6;   // P1 以上
function firePlayer(p){
  SFX.shot();
  const lv = p.power, x = p.x, y = p.y - 14;
  const D = 1 / FIRE_FREQ;   // 発射頻度を落とした分だけ1発の威力を上げ、総火力は据え置く
  // 中央レーザー：最初からこれ1本。P4 で大幅に強化される
  pshot(p, x, y-6, 0, -15, (lv >= 4 ? 12 : (lv >= 2 ? 6 : 5)) * D, 'big');
  if (lv >= 2){
    pshot(p, x-10, y+2, 0, -13, 4*D, 'n');
    pshot(p, x+10, y+2, 0, -13, 4*D, 'n');
  }
  if (lv >= 3){
    pshot(p, x-17, y+5, -0.9, -12.6, 4*D, 'n');
    pshot(p, x+17, y+5,  0.9, -12.6, 4*D, 'n');
  }
}

function doBomb(p){
  SFX.bomb();
  shake = 16; flash = 0.85; flashCol = p.col;
  // 敵弾を得点アイテムへ
  for (const b of eshots){
    if (Math.random() < 0.30) items.push({x:b.x,y:b.y,vx:rand(-1,1),vy:-1.2,type:'S',t:0});
    spark(b.x,b.y,2,'#ffd83d',2,14,2);
  }
  eshots.length = 0;
  beams.length = 0;
  // 全体ダメージ
  const DMG = 420;
  for (const e of enemies){ damageEnemy(e, DMG, p); }
  if (boss && boss.state === 'fight'){
    // 破壊可能パーツ（2面・4面ボスの砲塔／腕）
    for (const pt of boss.parts){
      if (!pt.alive) continue;
      pt.hp -= DMG; pt.flash = 4;
      if (pt.hp <= 0){ pt.alive = false; boom(boss.x+pt.dx, boss.y+pt.dy, 1.8, '#ffb85c'); p.score += 20000; }
    }
    // 衛星（5面ボス）にもダメージ
    if (boss.sats) for (const st of boss.sats){
      if (!st.alive) continue;
      st.hp -= DMG; st.flash = 4;
      if (st.hp <= 0){ st.alive = false; boom(boss.x+Math.cos(st.a)*st.r, boss.y+Math.sin(st.a)*st.r, 1.6, '#ffcf5c'); }
    }
    damageBoss(DMG, p, boss.x, boss.y);
  }
  for (let i=0;i<10;i++) spark(rand(0,W), rand(0,H*0.8), 8, p.col, 6, 34, 4);
}

function playerHitCheck(p){
  if (!p.playing || !p.alive || p.inv > 0) return;
  const r = p.hitR;
  // 敵弾
  for (let i=eshots.length-1;i>=0;i--){
    const b = eshots[i];
    if (Math.abs(b.x-p.x) < b.r+r && Math.abs(b.y-p.y) < b.r+r &&
        hyp(b.x-p.x, b.y-p.y) < b.r + r){ killPlayer(p); return; }
  }
  // 敵本体
  for (const e of enemies){
    if (e.dead) continue;
    if (hyp(e.x-p.x, e.y-p.y) < e.r*0.8 + r){ killPlayer(p); return; }
  }
  // ボス本体
  if (boss && boss.state==='fight'){
    if (Math.abs(p.x-boss.x) < boss.w/2 - 6 && Math.abs(p.y-boss.y) < boss.h/2 - 6){ killPlayer(p); return; }
  }
  // レーザー
  for (const bm of beams){
    if (!bm.active) continue;
    if (distToRay(p.x,p.y, bm.x,bm.y, bm.ang, bm.len) < bm.w*0.5 + r){ killPlayer(p); return; }
  }
}
function killPlayer(p){
  p.alive = false;
  p.lives--;
  p.power = Math.max(0, p.power - 1);
  p.respawn = 70;
  SFX.death();
  boom(p.x, p.y, 1.6, p.col);
  spark(p.x,p.y,26,'#fff',5,30,3);
  // お詫びのパワーアイテム
  if (p.lives >= 0) dropItem(p.x, Math.max(60, p.y-40), 'P');
  if (p.lives < 0){
    p.outWait = 600;   // 10秒
    p.respawn = 0;
  }
}

function drawPlayer(p){
  if (!p.playing || p.lives < 0 || !p.alive) return;
  if (p.inv > 0 && Math.floor(p.t/3)%2===0) return;
  const cx = dot(p.x), cy = dot(p.y);

  // エンジン炎（ドット単位でちらつかせる）
  const fl = 2 + (Math.random()*3|0);
  for (let i = 0; i < fl; i++){
    const a = 1 - i/fl;
    rct(cx-2, cy + 8 + i, 1, 1, a > 0.5 ? '#ffffff' : p.col);
    rct(cx+1, cy + 8 + i, 1, 1, a > 0.5 ? '#ffffff' : p.col);
  }
  drawShipArt(p);

  // 無敵中のリング
  if (p.inv > 0) ringDot(cx, cy, 9 + Math.sin(p.t*0.2)*1.5, p.col);
  // ボム発動の輪
  if (p.bombT > 0){
    const k = 1 - p.bombT/150;
    ringDot(cx, cy, 14 + k*200, p.col);
    ringDot(cx, cy, 12 + k*200, '#ffffff');
  }
}

let enemies = [];
let sched = [];   // 遅延スポーン
function later(delay, fn){ sched.push({t: stageTime + delay, fn}); }

const EK = {
  pop:    {hp:1,  r:12, score:120,  col:'#ff8a5c', draw:dSprite,    ai:aiPop,  weak:true},
  zig:    {hp:9,  r:13, score:260,  col:'#8affd1', draw:dSprite,    ai:aiZig},

};

function spawn(kind, x, y, o){
  const k = EK[kind];
  const e = Object.assign({
    kind, x, y, k, r:k.r,
    // weak な敵は必ず1発で落ちる（面や人数によるHP補正をかけない）
    hp: k.weak ? 1 : Math.ceil(k.hp * hpScale), maxHp: k.weak ? 1 : Math.ceil(k.hp * hpScale),
    t:0, vx:0, vy:1.6, flash:0, dead:false, ang:0, phase:0, fireT:0,
    drop: k.drop || null, dir: x < W/2 ? 1 : -1
  }, o || {});
  enemies.push(e);
  return e;
}
function wave(kind, n, gap, xf, o){
  for (let i=0;i<n;i++){
    later(i*gap, () => {
      const opt = Object.assign({}, o);
      if (opt.mk) opt.mk(opt, i);
      spawn(kind, xf(i), (o && o.y0 !== undefined) ? o.y0 : -34, opt);
    });
  }
}

function damageEnemy(e, dmg, from, byFuse){
  if (e.dead) return;
  e.hp -= dmg; e.flash = 4;
  if (e.hp <= 0){
    e.dead = true;
    if (from) from.score += e.k.score;
    boom(e.x, e.y, e.r/16, e.k.col);
    if (e.r > 20) SFX.big(); else SFX.pop();
    // 機雷は時間切れで自爆したときだけ弾を撒く（撃ち落とせば安全）
    if (e.kind === 'mine' && byFuse) ringShot(e.x,e.y, 10, 2.4*bulSp, rand(0,TAU), {col:'#ffe066', r:5});
    if (e.drop) dropItem(e.x, e.y, e.drop);
    else if (Math.random() < 0.07) dropItem(e.x, e.y, pick(['S','S','B','P']));
  } else SFX.hit();
}

/* --- AI --- */
function aiPop(e){
  e.y += e.vy; e.x += e.vx;
  if (e.sine) e.x += Math.sin(e.t*0.05)*1.6;
  if (fireAt(e.t, 90, 60) && e.y > 0 && e.shoot) eshotA(e.x,e.y+8, aimAng(e.x,e.y), 2.6*bulSp, {col:'#ff9a5c'});
}
function aiZig(e){
  e.y += e.vy;
  e.x += Math.sin(e.t*0.045 + (e.ph||0)) * 2.6 * e.dir;
  if (fireAt(e.t, 76, 40) && e.y > 20) fan(e.x,e.y+8, aimAng(e.x,e.y), 2, 0.22, 2.9*bulSp, {col:'#8affd1'});
}
function aiDive(e){
  // 進入 → 停止 → 狙撃 → 加速離脱
  if (e.t < 46){ e.y += 3.4; }
  else if (e.t < 106){
    e.y += 0.35;
    e.x += Math.sin(e.t*0.07)*1.4;
    if (e.t === 62 || (dens > 0.40 && e.t === 88))
      fan(e.x,e.y+8, aimAng(e.x,e.y), 3, 0.20, 3.3*bulSp, {col:'#ffd45c'});
  } else {
    e.y += Math.min(8, (e.t-106)*0.28 + 1.5);
    e.x += e.vx;
  }
}
function aiSniper(e){
  // 横から進入し、水平移動しつつ狙撃
  if (e.t < 40){ e.y += 2.2; e.x += e.sx*2.4; }
  else { e.x += e.sx*1.5; e.y += 0.25; }
  if (e.t > 40 && fireAt(e.t, 64, 0)) fan(e.x,e.y, aimAng(e.x,e.y), 3, 0.30, 3.6*bulSp, {col:'#c98aff', type:'needle', r:4.5});
}
function aiTurret(e){
  const ty = e.ty || 130;
  if (e.y < ty) e.y += 1.8;
  else {
    e.stayT = (e.stayT||0) + 1;
    e.x += Math.sin(e.t*0.03)*0.9;
    if (fireAt(e.stayT, 96, 30)){
      const off = rand(0,TAU);
      ringShot(e.x,e.y, 10 + stageIndex, 2.4*bulSp, off, {col:'#9fd8ff'});
    }
    if (fireAt(e.stayT, 96, 66)) fan(e.x,e.y, aimAng(e.x,e.y), 3, 0.26, 3.4*bulSp, {col:'#fff2a0'});
    if (e.stayT > 560) e.y += 2.6;
  }
  e.ang += 0.05;
}
function aiCarrier(e){
  if (e.y < 110) e.y += 1.4;
  else {
    e.x += Math.sin(e.t*0.018) * 1.9;
    if (fireAt(e.t, 110, 0)){
      for (const s of [-1,1]){
        const c = spawn('pop', e.x + s*24, e.y+10, {vy:2.4, vx:s*0.9, shoot:true});
        c.t = 0;
      }
      tone(300,0.08,'square',0.05,500);
    }
    if (fireAt(e.t, 150, 80)) ringShot(e.x,e.y, 12, 2.2*bulSp, rand(0,TAU), {col:'#7fa8ff'});
  }
  if (e.t > 900) e.y += 2.2;
}
function aiHeavy(e){
  if (e.y < 120) e.y += 1.2;
  else {
    e.x += Math.sin(e.t*0.016) * 2.2;
    if (fireAt(e.t, 84, 40)) fan(e.x-22,e.y+6, aimAng(e.x,e.y), 4, 0.19, 3.2*bulSp, {col:'#ff8fa8'});
    if (fireAt(e.t, 84, 58)) fan(e.x+22,e.y+6, aimAng(e.x,e.y), 4, 0.19, 3.2*bulSp, {col:'#ff8fa8'});
    if (fireAt(e.t, 210, 150)) ringShot(e.x,e.y, 18, 2.5*bulSp, rand(0,TAU), {col:'#ffd0dc'});
  }
  if (e.t > 1000) e.y += 2.0;
}
function aiMine(e){
  e.y += e.vy * (e.t < 60 ? 1 : 0.25);
  e.x += e.vx;
  e.ang += 0.08;
  if (e.t > (e.fuse || 260)) damageEnemy(e, 9999, null, true);
}

function dSprite(e){

function updateEnemies(){

let boss = null;

function makeBoss(def){
  return {
    def, name:def.name, title:def.title,
    x: W/2, y: -170, w:def.w, h:def.h,
    hp: Math.round(def.hp*bossScale), maxHp: Math.round(def.hp*bossScale),
    t:0, phase:0, phaseT:0, state:'enter', flash:0, dieT:0, ang:0, sub:0,
    parts: (def.parts||[]).map(p => Object.assign({}, p, {
      hp: Math.round(p.hp*bossScale), maxHp: Math.round(p.hp*bossScale), alive:true, flash:0
    }))
  };
}
function damageBoss(dmg, from, hx, hy){
  if (!boss || boss.state !== 'fight') return;
  // パーツ優先
  for (const p of boss.parts){
    if (!p.alive) continue;
    const px = boss.x + p.dx, py = boss.y + p.dy;
    if (hx !== undefined && hyp(hx-px, hy-py) < p.r){
      p.hp -= dmg; p.flash = 4;
      if (from) from.score += Math.round(dmg*2);
      if (p.hp <= 0){
        p.alive = false; boom(px,py, 1.8, '#ffb85c'); SFX.big();
        if (from) from.score += 20000;
      } else SFX.hit();
      return;
    }
  }
  boss.hp -= dmg; boss.flash = 3;
  if (from) from.score += Math.round(dmg*2);
  SFX.hit();
  if (boss.hp <= 0){
    boss.hp = 0; boss.state = 'dying'; boss.dieT = 0;
    eshots.length = 0; beams.length = 0;
    SFX.huge(); flash = 0.6; flashCol='#fff';
  }
}
function bossHitTest(s){
  if (!boss || boss.state !== 'fight') return false;
  for (const p of boss.parts){
    if (!p.alive) continue;
    if (hyp(s.x-(boss.x+p.dx), s.y-(boss.y+p.dy)) < p.r + s.r) return true;
  }
  return Math.abs(s.x-boss.x) < boss.w/2 && Math.abs(s.y-boss.y) < boss.h/2;
}
function bossPhaseCheck(){
  const ph = boss.def.phases;
  while (boss.phase < ph.length-1 && boss.hp/boss.maxHp <= ph[boss.phase].until){
    boss.phase++; boss.phaseT = 0;
    // 弾消し＋演出
    for (const b of eshots) if (Math.random()<0.25) items.push({x:b.x,y:b.y,vx:rand(-1,1),vy:-1.2,type:'S',t:0});
    eshots.length = 0; beams.length = 0;
    shake = 12; flash = 0.45; flashCol = '#ffcf66';
    SFX.big();
  }
}
function updateBoss(){
  if (!boss) return;
  boss.t++; boss.ang += 0.02;
  if (boss.flash>0) boss.flash--;
  for (const p of boss.parts) if (p.flash>0) p.flash--;

  if (boss.state === 'enter'){
    boss.y += 1.9;
    if (boss.y >= boss.def.ey){ boss.y = boss.def.ey; boss.state = 'fight'; boss.phaseT = 0; }
  } else if (boss.state === 'fight'){
    boss.phaseT++;
    boss.def.phases[boss.phase].run(boss, boss.phaseT);
    bossPhaseCheck();
  } else if (boss.state === 'dying'){
    boss.dieT++;
    if (boss.dieT % 7 === 0){
      boom(boss.x + rand(-boss.w/2, boss.w/2), boss.y + rand(-boss.h/2, boss.h/2), 1.5, pick(['#ffd27a','#ff7a5c','#fff']));
      SFX.pop();
    }
    if (boss.dieT === 130){
      boom(boss.x, boss.y, 5, '#fff'); SFX.huge(); flash = 1.0; flashCol='#fff'; shake = 22;
      for (const p of players) if (p.playing && p.lives >= 0) p.score += boss.def.bonus;
      for (let i=0;i<3;i++) dropItem(boss.x + rand(-60,60), boss.y, pick(['P','B','S','S']));
    }
    if (boss.dieT > 190){ boss = null; stageCleared(); }
  }
}
let bossFlash = false;
const bc = c => bossFlash ? '#ffffff' : c;
function drawBoss(){
  if (!boss) return;
  if (boss.state === 'dying' && Math.floor(boss.dieT/4)%2 === 0) return;   // 撃破中は点滅
  bossFlash = boss.flash > 0;
  boss.def.draw(boss, Math.round(dot(boss.x)), Math.round(dot(boss.y)));
  bossFlash = false;
}

/* --- レーザー（ビーム） --- */
function updateBeams(){
  for (let i=beams.length-1;i>=0;i--){
    const b = beams[i];
    b.t++;
    if (b.owner){
      b.x = b.owner.x + (b.ox||0); b.y = b.owner.y + (b.oy||0);
    }
    if (b.rot) b.ang += b.rot;
    if (b.t === b.charge) SFX.laser();
    b.active = b.t > b.charge && b.t <= b.charge + b.dur;
    if (b.t > b.charge + b.dur) beams.splice(i,1);
  }
}
function drawBeams(){
  for (const b of beams){
    const x0 = dot(b.x), y0 = dot(b.y);
    const len = dot(b.len), w = Math.max(1, Math.round(dot(b.w)));
    const dx = Math.cos(b.ang), dy = Math.sin(b.ang);
    if (!b.active){
      // 予告線：点線でチカチカさせる
      if (Math.floor(b.t/3)%2 === 0) continue;
      for (let t = 0; t < len; t += 3) pset(x0+dx*t, y0+dy*t, '#ff5a6e');
      disc(x0, y0, 1 + (b.t/b.charge)*3, '#ff9aa8');
    } else {
      const fade = Math.min(1, (b.charge + b.dur - b.t)/8);
      const half = Math.max(1, Math.round(w*fade/2));
      const nx = -dy, ny = dx;
      for (let t = 0; t < len; t++){
        const cx = x0 + dx*t, cy = y0 + dy*t;
        for (let o = -half; o <= half; o++){
          const a = Math.abs(o);
          pset(cx + nx*o, cy + ny*o, a === 0 ? '#ffffff' : (a <= half*0.55 ? '#ffd0e0' : '#ff3b6b'));
        }
      }
    }
  }
}

/* ボスの左右移動。
   位相を積算するのでフェーズが変わって速度・振幅が変わっても位置が連続し、
   さらに 1フレームの移動量に上限を設けるので、どんな状態からでも瞬間移動しない。 */
const BOSS_MAX_SPEED = 4.2;
function bossMove(b, amp, spd, base, ampY, spdY){
  if (b.mph === undefined){
    b.mph = 0; b.mphY = 0;
    b.amp = amp; b.ampY = (ampY === undefined ? 8 : ampY);
    b.baseY = (base === undefined ? b.y : base);
  }
  b.mph  += spd;
  b.mphY += (spdY === undefined ? spd*0.7 : spdY);
  // 振幅・中心はゆっくり追従させる（切り替わりを目立たせない）
  b.amp  += clamp(amp - b.amp, -0.8, 0.8);
  b.ampY += clamp((ampY === undefined ? 8 : ampY) - b.ampY, -0.3, 0.3);
  const tx = W/2 + Math.sin(b.mph) * b.amp;
  b.x += clamp(tx - b.x, -BOSS_MAX_SPEED, BOSS_MAX_SPEED);
  if (base !== undefined){
    b.baseY += clamp(base - b.baseY, -0.5, 0.5);
    const ty = b.baseY + Math.sin(b.mphY) * b.ampY;
    b.y += clamp(ty - b.y, -BOSS_MAX_SPEED, BOSS_MAX_SPEED);
  }
}

/* 衛星の当たり判定（BOSS5専用） */
function satHitTest(s){
  if (!boss || !boss.sats || boss.state !== 'fight') return null;
  for (const st of boss.sats){
    if (!st.alive) continue;
    const sx = boss.x + Math.cos(st.a)*st.r, sy = boss.y + Math.sin(st.a)*st.r;
    if (hyp(s.x-sx, s.y-sy) < 18 + s.r) return {st, sx, sy};
  }
  return null;
}

/* 面ごとのグラデーションを一度だけオフスクリーンに焼く。
   帯の境目には市松のディザを入れて、ドット絵らしい階調にする。 */
function bakeBG(cols, extra){
  const c = document.createElement('canvas');
  c.width = PW; c.height = PH;
  const g = c.getContext('2d');
  const n = cols.length, bh = PH / n;
  for (let i = 0; i < n; i++){
    g.fillStyle = cols[i];
    g.fillRect(0, Math.floor(i*bh), PW, Math.ceil(bh)+1);
  }
  for (let i = 1; i < n; i++){          // 境目のディザ
    const y = Math.floor(i*bh);
    g.fillStyle = cols[i-1];
    for (let x = 0; x < PW; x += 2) g.fillRect(x, y, 1, 1);
    g.fillStyle = cols[i];
    for (let x = 1; x < PW; x += 2) g.fillRect(x, y-1, 1, 1);
  }
  if (extra) extra(g);
  return c;
}

function initBG(idx){
  bgProps = []; bgFar = []; bgSky = [];
  if (idx === 0){                        // 空：雲を2層
    for (let i=0;i<14;i++) bgProps.push({x:rand(-40,W+40), y:rand(-H,H), s:rand(0.7,1.6), sp:rand(1.2,2.2), a:1});
    for (let i=0;i<18;i++) bgFar.push({x:rand(0,W), y:rand(-H,H), s:rand(0.3,0.6), sp:rand(0.3,0.7)});
    for (let i=0;i<10;i++) bgSky.push({x:rand(0,W), y:rand(-H,H), s:rand(0.8,2.0), sp:rand(0.12,0.3), k:rint(0,2)});
    bgBake = bakeBG(SKY, g => {          // 太陽の光芒
      g.fillStyle = '#2a4a7a';
      for (let r = 30; r > 0; r -= 6){ g.globalAlpha = 0.10; g.beginPath(); g.arc(150, 26, r, 0, TAU); g.fill(); }
      g.globalAlpha = 1;
    });
  } else if (idx === 1){                 // 海：島＋深場
    for (let i=0;i<9;i++)  bgProps.push({x:rand(20,W-20), y:rand(-H,H), s:rand(0.7,1.7), sp:rand(1.0,1.6), a:1, t:rand(0,10)});
    for (let i=0;i<12;i++) bgFar.push({x:rand(0,W), y:rand(-H,H), s:rand(0.6,1.4), sp:rand(0.4,0.8)});
    for (let i=0;i<14;i++) bgSky.push({x:rand(0,W), y:rand(-H,H), s:rand(0.5,1.4), sp:rand(0.9,1.5), k:rint(0,2)});
    bgBake = bakeBG(SEA);
  } else if (idx === 2){                 // 峡谷：岩＋溶岩
    for (let i=0;i<16;i++) bgProps.push({x:rand(0,W), y:rand(-H,H), s:rand(0.6,1.6), sp:rand(1.2,2.2), a:1, r:rand(0,TAU)});
    for (let i=0;i<10;i++) bgFar.push({x:rand(0,W), y:rand(-H,H), s:rand(0.8,1.6), sp:rand(0.4,0.8)});
    for (let i=0;i<9;i++)  bgSky.push({x:rand(0,W), y:rand(-H,H), s:rand(0.7,1.5), sp:rand(1.0,1.8), k:rint(0,2)});
    bgBake = bakeBG(CANY);
  } else if (idx === 3){                 // 都市：ビル2層
    for (let i=0;i<20;i++) bgProps.push({x:rand(-20,W+20), y:rand(-H,H), s:rand(0.7,1.5), sp:rand(1.4,2.4), a:1,
      w:rand(28,70), h:rand(70,200), seed:rint(0,9999)});
    for (let i=0;i<22;i++) bgFar.push({x:rand(0,W), y:rand(-H,H), s:rand(0.3,0.6), sp:rand(0.4,0.9),
      w:rand(24,54), h:rand(60,150), seed:rint(0,9999)});
    for (let i=0;i<8;i++)  bgSky.push({x:rand(20,W-20), y:rand(-H,H), s:rand(0.8,1.5), sp:rand(1.6,2.6), seed:rint(0,9999), k:rint(0,3)});
    bgBake = bakeBG(CITY);
  } else {                               // 宇宙要塞：パネル＋星雲
    for (let i=0;i<16;i++) bgProps.push({x:rand(0,W), y:rand(-H,H), s:rand(0.7,1.5), sp:rand(1.4,2.6), a:1, seed:rint(0,9999)});
    for (let i=0;i<8;i++)  bgFar.push({x:rand(0,W), y:rand(-H,H), s:rand(1.2,2.6), sp:rand(0.3,0.6), seed:rint(0,9999)});
    for (let i=0;i<10;i++) bgSky.push({x:rand(0,W), y:rand(-H,H), s:rand(0.8,1.8), sp:rand(1.8,3.0), seed:rint(0,9999), k:rint(0,3)});
    bgBake = bakeBG(['#01030a','#01030a','#02040c','#02040c','#03050e','#03050e','#040610','#040610']);
  }
}

function updateBG(){
  scrollY += bgSpeed;
  for (const s of stars){ s.y += s.z*bgSpeed*0.7; if (s.y > H){ s.y = -4; s.x = rand(0,W); } }
  for (const p of bgProps){
    p.y += p.sp * bgSpeed * 0.5;
    if (p.y > H + 220){ p.y = -rand(120, 320); p.x = rand(-20, W+20); }
  }
  for (const p of bgFar){
    p.y += p.sp * bgSpeed * 0.5;
    if (p.y > H + 260){ p.y = -rand(140, 360); p.x = rand(0, W); }
  }
  for (const p of bgSky){
    p.y += p.sp * bgSpeed * 0.5;
    if (p.y > H + 300){ p.y = -rand(160, 400); p.x = rand(0, W); }
  }
}

const SKY   = ['#0a1730','#0d1e3c','#122748','#173055','#1d3a63','#234471','#2a4f80','#31598d'];
const SEA   = ['#020c16','#04121f','#061929','#082033','#0a273e','#0c2e48','#0e3553','#103c5e'];
const CANY  = ['#120802','#1b0d05','#241308','#2d190b','#37200e','#412812','#4b3016','#55381a'];
const CITY  = ['#03050d','#050810','#070b15','#090e1a','#0b111f','#0d1424','#0f1729','#111a2e'];

function drawBG(idx){
  ctx.drawImage(bgBake, 0, 0);           // 焼いておいたグラデーション

  if (idx === 0){                        // ---- 空 ----
    for (const p of bgSky){              // 最遠景：巻雲と鳥の群れ
      const x = Math.round(dot(p.x)), y = Math.round(dot(p.y)), s = p.s;
      if (p.k === 0){                    // 巻雲（薄い筋）
        for (let i = 0; i < 5; i++) rct(x + i*4 - 8, y + (i&1), Math.round(3*s), 1, '#243a5c');
      } else {                           // 鳥の群れ
        for (let i = 0; i < 4; i++){
          const bx = x + i*5 - 7, by = y + ((i*3)%4) - 2;
          const f = (Math.floor(scrollY*0.08) + i) % 2;
          pset(bx, by+f, '#1d2f4a'); pset(bx+1, by, '#1d2f4a'); pset(bx+2, by+f, '#1d2f4a');
        }
      }
    }
    for (const p of bgFar){              // 遠くの小さな雲
      const x = Math.round(dot(p.x)), y = Math.round(dot(p.y)), s = p.s;
      oval(x, y, 9*s, 2*s, '#2b4266');
      oval(x+5*s, y+1, 6*s, 2*s, '#2b4266');
    }
    for (const p of bgProps){            // 手前の雲（上に光、下に影）
      const x = Math.round(dot(p.x)), y = Math.round(dot(p.y)), s = p.s;
      oval(x, y+2, 14*s, 4*s, '#33507a');            // 影
      oval(x-7*s, y+3, 8*s, 3*s, '#33507a');
      oval(x+8*s, y+2, 9*s, 3*s, '#33507a');
      oval(x, y, 13*s, 4*s, '#48699a');              // 本体
      oval(x-7*s, y+1, 8*s, 3*s, '#48699a');
      oval(x+8*s, y, 9*s, 3*s, '#48699a');
      oval(x-2*s, y-2*s, 8*s, 2*s, '#6a8cbc');       // ハイライト
      oval(x+7*s, y-1*s, 5*s, 1*s, '#6a8cbc');
    }
  } else if (idx === 1){                 // ---- 海 ----
    for (const p of bgSky){              // 白波・岩礁・ブイ
      const x = Math.round(dot(p.x)), y = Math.round(dot(p.y)), s = p.s;
      if (p.k === 0){                    // 白波のかたまり
        oval(x, y, 7*s, 2*s, '#3f7f9c');
        pset(x-2, y-1, '#8fd0e8'); pset(x+2, y, '#8fd0e8'); pset(x, y+1, '#8fd0e8');
      } else if (p.k === 1){             // 岩礁
        rct(x-3*s, y-2*s, 6*s, 4*s, '#16303c'); rct(x-2*s, y-3*s, 3*s, 2*s, '#22475a');
        for (let a2 = 0; a2 < 6; a2++) pset(x + Math.cos(a2)*5*s, y + Math.sin(a2)*3*s, '#7fbcd4');
      } else {                           // ブイ
        rct(x-1, y-3, 2, 5, '#8a3f2a');
        pset(x, y-4, (Math.floor(scrollY*0.06) % 2) ? '#ff8a4a' : '#5a2a18');
      }
    }
    for (const p of bgFar){              // 深場の影
      const x = Math.round(dot(p.x)), y = Math.round(dot(p.y));
      oval(x, y, 20*p.s, 8*p.s, '#02101c');
    }
    for (let i = 0; i < 12; i++){        // 波
      const y = Math.round(((scrollY*0.9/PIXEL + i*22) % (PH+22)) - 11);
      ctx.fillStyle = '#2c6a90';
      for (let x = (i*7)%6; x < PW; x += 6)
        ctx.fillRect(x, y + Math.round(Math.sin(x*0.18 + scrollY*0.02 + i)*1.6), 3, 1);
      ctx.fillStyle = '#6fb4d8';
      for (let x = (i*11)%14; x < PW; x += 14)
        ctx.fillRect(x, y + Math.round(Math.sin(x*0.18 + scrollY*0.02 + i)*1.6), 1, 1);
    }
    for (const p of bgProps){            // 島
      const x = Math.round(dot(p.x)), y = Math.round(dot(p.y)), s = p.s;
      oval(x, y, 24*s, 12*s, '#1a5a74');             // 浅瀬
      oval(x, y, 21*s, 10*s, '#0f3f52');
      oval(x, y, 18*s, 9*s,  '#6a5f3c');             // 砂浜
      oval(x, y-1*s, 14*s, 7*s, '#134a36');          // 緑
      oval(x-4*s, y-2*s, 7*s, 3*s, '#1f7a56');
      pset(x+3*s, y-3*s, '#2b9c6c');
      if (Math.floor(p.t + scrollY*0.02) % 2 === 0)  // 波打ち際
        for (let a = 0; a < 8; a++){
          const th = a*TAU/8;
          pset(x + Math.cos(th)*22*s, y + Math.sin(th)*11*s, '#9fd8ee');
        }
    }
  } else if (idx === 2){                 // ---- 峡谷 ----
    for (const p of bgSky){              // 土煙・小石・溶岩の飛沫
      const x = Math.round(dot(p.x)), y = Math.round(dot(p.y)), s = p.s;
      if (p.k === 0) oval(x, y, 6*s, 2*s, '#2a1a0c');
      else if (p.k === 1){ pset(x, y, '#4d3418'); pset(x+2, y+1, '#3d2812'); }
      else { pset(x, y, '#c2431a'); pset(x, y-1, '#ff9a3b'); }
    }
    for (const p of bgFar){              // 奥の岩肌
      const x = Math.round(dot(p.x)), y = Math.round(dot(p.y)), s = p.s;
      rct(x-8*s, y-6*s, 16*s, 12*s, '#1d0f05');
    }
    for (let i = 0; i < 18; i++){        // 両側の壁＋地層
      const y = Math.round(((scrollY*1.2/PIXEL + i*28) % (PH+56)) - 28);
      const w1 = 12 + Math.round(Math.sin(i*1.7)*8), w2 = 12 + Math.round(Math.cos(i*1.3)*9);
      rct(0, y, w1, 28, '#170b03');  rct(PW-w2, y, w2, 28, '#170b03');
      rct(w1-2, y, 2, 28, '#33210c'); rct(PW-w2, y, 2, 28, '#33210c');
      for (let k = 4; k < 28; k += 7){   // 地層の線
        rct(0, y+k, w1-3, 1, '#221205'); rct(PW-w2+3, y+k, w2-3, 1, '#221205');
      }
      if (i % 3 === 0){                  // 溶岩の裂け目
        rct(1, y+10, 3, 6, '#c2431a'); rct(2, y+11, 1, 4, '#ff9a3b');
        rct(PW-4, y+18, 3, 6, '#c2431a'); rct(PW-3, y+19, 1, 4, '#ff9a3b');
      }
    }
    for (const p of bgProps){            // 岩
      const x = Math.round(dot(p.x)), y = Math.round(dot(p.y)), s = p.s;
      rct(x-6*s, y-4*s, 12*s, 9*s, '#241206');
      rct(x-4*s, y-5*s, 8*s, 3*s,  '#3a2009');
      rct(x-6*s, y+4*s, 12*s, 1,   '#120802');
      pset(x-2*s, y-3*s, '#4d2c0c');
    }
  } else if (idx === 3){                 // ---- 夜の街 ----
    for (const st of stars) pset(dot(st.x), dot(st.y), st.z > 2.4 ? '#9fc8ff' : '#2b3d60');
    for (let i = 0; i < 3; i++){         // 道路（光の帯が流れる）
      const x = 26 + i*62;
      rct(x, 0, 6, PH, '#080c18');
      for (let k = 0; k < 6; k++){
        const y = Math.round(((scrollY*2.2/PIXEL + k*44 + i*17) % (PH+40)) - 20);
        rct(x+1, y, 1, 2, '#8a6f3a'); rct(x+4, y+22, 1, 2, '#7a3f38');
      }
    }
    drawCity(bgFar, 0.18, '#0a0f1e', '#141c33', 0.22);
    for (const p of bgSky){              // 屋上のビルボードとサーチライト
      const x = Math.round(dot(p.x)), y = Math.round(dot(p.y)), s = p.s;
      if (p.k < 2){                      // 電光掲示板
        const w = Math.round(10*s), h = Math.round(6*s);
        rct(x-w/2, y-h/2, w, h, '#0b1120');
        rct(x-w/2, y-h/2, w, 1, '#2a3c66');
        const ph = Math.floor(scrollY*0.09) + p.seed;
        for (let ry = 1; ry < h-1; ry++)
          for (let rx = 1; rx < w-1; rx++)
            if (((rx + ry + ph) % 5) < 2) pset(x-w/2+rx, y-h/2+ry, p.k ? '#ff5a8a' : '#4fd0ff');
      } else {                           // サーチライト
        const sw = Math.sin(scrollY*0.02 + p.seed)*0.5;
        for (let t = 0; t < 26*s; t++)
          if ((t + Math.floor(scrollY*0.1)) % 3) pset(x + t*sw, y - t, '#16304e');
        pset(x, y, '#9fd8ff');
      }
    }
    drawCity(bgProps, 0.28, '#111830', '#1e2a4a', 0.40);
  } else {                               // ---- 宇宙要塞 ----
    for (const p of bgFar){              // 星雲
      const x = Math.round(dot(p.x)), y = Math.round(dot(p.y)), s = p.s;
      ctx.globalAlpha = 0.18;
      oval(x, y, 22*s, 14*s, (p.seed % 2) ? '#2a1a5c' : '#123a5c');
      oval(x-6*s, y+3, 14*s, 8*s, (p.seed % 2) ? '#3a2472' : '#1a4c70');
      ctx.globalAlpha = 1;
    }
    for (const st of stars)
      pset(dot(st.x), dot(st.y), st.z > 2.4 ? '#ffffff' : (st.z > 1.4 ? '#9fc0ff' : '#3a4d78'));
    for (const p of bgSky){              // 歯車・タンク・警告灯
      const x = Math.round(dot(p.x)), y = Math.round(dot(p.y)), s = p.s;
      if (p.k === 0){                    // 回転する歯車
        const a0 = scrollY*0.01 + p.seed;
        disc(x, y, 6*s, '#14203a'); disc(x, y, 3*s, '#0a1220');
        for (let i = 0; i < 8; i++){
          const a = a0 + i*TAU/8;
          rct(x + Math.cos(a)*7*s - 1, y + Math.sin(a)*7*s - 1, 2, 2, '#1e2f52');
        }
      } else if (p.k === 1){             // 円筒タンク
        rct(x-4*s, y-8*s, 8*s, 16*s, '#0d1728');
        rct(x-4*s, y-8*s, 1, 16*s, '#1e3050'); rct(x+4*s-1, y-8*s, 1, 16*s, '#1e3050');
        for (let k = -6; k < 7; k += 4) rct(x-4*s, y+k*s, 8*s, 1, '#152438');
      } else {                           // 警告灯
        pset(x, y, (Math.floor(scrollY*0.08) % 2) ? '#ff5a5a' : '#3a1010');
        rct(x-1, y+1, 3, 2, '#182234');
      }
    }
    for (const p of bgProps){            // 装甲パネル
      const w = Math.round(28*p.s), h = Math.round(40*p.s);
      const x = Math.round(dot(p.x)) - (w>>1), y = Math.round(dot(p.y)) - (h>>1);
      rct(x, y, w, h, '#0a1120');
      rct(x, y, w, 1, '#22355a'); rct(x, y+h-1, w, 1, '#22355a');
      rct(x, y, 1, h, '#22355a'); rct(x+w-1, y, 1, h, '#22355a');
      for (let k = 3; k < w-3; k += 4) pset(x+k, y+2, '#16233c');   // リベット
      rct(x+3, y+6, w-6, 4, '#131f36');                             // 通風口
      for (let k = 0; k < 4; k++) rct(x+4, y+7+((k%2)), w-8, 1, '#0c1526');
      if (p.seed % 3 === 0){                                        // 警告ストライプ
        for (let k = 0; k < w-6; k += 4){ rct(x+3+k, y+h-9, 2, 3, '#c8a020'); rct(x+5+k, y+h-9, 2, 3, '#1a1a1a'); }
      }
      rct(x+2, y+h-5, w-4, 2, ((p.seed + (scrollY/24|0)) % 5 === 0) ? '#2fd0ff' : '#0f3a4e');
    }
    for (let i = 0; i < 5; i++){         // エネルギー導管
      const x = 18 + i*39;
      rct(x, 0, 1, PH, '#0e2038');
      const y = Math.round(((scrollY*3/PIXEL + i*54) % (PH+48)) - 24);
      rct(x, y, 1, 18, '#4fb8ff'); rct(x, y+6, 1, 5, '#c8f0ff');
    }
  }
}

// ビル群（近景・遠景で共通）
function drawCity(list, scale, body, edge, litRate){
  for (const p of list){
    const w = Math.max(4, Math.round(p.w*p.s*scale)), h = Math.max(8, Math.round(p.h*p.s*scale));
    const x = Math.round(dot(p.x)) - (w>>1), y = Math.round(dot(p.y)) - (h>>1);
    rct(x, y, w, h, body);
    rct(x, y, w, 1, edge);
    rct(x, y, 1, h, edge);
    let sd = p.seed;
    for (let ry = 2; ry < h-1; ry += 3)
      for (let rx = 1; rx < w-1; rx += 3){
        sd = (sd*1103515245 + 12345) & 0x7fffffff;
        if ((sd % 100) < litRate*100) pset(x+rx, y+ry, (sd % 9 === 0) ? '#ffd27a' : '#7fc4e8');
      }
    if (w > 8){                                  // 屋上のアンテナと航空障害灯
      const ax = x + (w>>1);
      rct(ax, y-4, 1, 4, edge);
      if ((p.seed + (scrollY/20|0)) % 3 === 0) pset(ax, y-5, '#ff5a5a');
      rct(x+1, y-1, 2, 1, edge); rct(x+w-3, y-1, 2, 1, edge);
    }
  }
}

/* ============================================================
   11. ゲーム進行
   ============================================================ */
let state = 'title';          // title / intro / play / warning / clear / gameover / ending
let paused = false;
let stageIndex = 0, stageTime = 0, scriptPtr = 0;
let scrollY = 0, bgSpeed = 2.0;
let bulSp = 1.0, hpScale = 1.0, bossScale = 1.0;
let dens = 1.0, cdens = 1.0;   // 弾密度（面ごと）／一度に撒く弾数の係数
const FIRE_RATE = 0.5;         // 敵弾の発射頻度の全体倍率
let bossSpawned = false, warnT = 0, introT = 0, clearT = 0, overT = 0, endT = 0;
let gameFrame = 0, totalContinues = 0;

// タイトル画面
let menuSel = 0, menuPlayers = 1, menuStage = 0, menuSound = true;
const MENU_ROWS = 4;

function resetRun(){
  players = [makePlayer(0), makePlayer(1)];
  players[0].playing = true; players[0].alive = true; players[0].inv = 140;
  if (menuPlayers === 2){ players[1].playing = true; players[1].alive = true; players[1].inv = 140; }
  totalContinues = 0;
  stageIndex = menuStage;
  startStage(stageIndex);
}
function clearField(){
  enemies.length = 0; eshots.length = 0; pshots.length = 0;
  items.length = 0; beams.length = 0; particles.length = 0;
  sched.length = 0; boss = null;
}
function startStage(idx){
  clearField();
  stageIndex = idx;
  stageTime = 0; scriptPtr = 0; bossSpawned = false;
  const st = STAGES[idx];
  bgSpeed = st.speed;
  bulSp   = 0.88 + idx*0.03;
  dens    = st.dens * FIRE_RATE;   // 発射間隔（小さいほど間隔が長い）
  cdens   = Math.sqrt(st.dens);    // 1回に撒く弾数（頻度とは独立に決める）
  hpScale = (1.0 + idx*0.09) * (playingCount() > 1 ? 1.45 : 1.0);
  bossScale = (playingCount() > 1 ? 1.75 : 1.0);
  initBG(idx); initStars();
  state = 'intro'; introT = 0;
  Bgm.play(st.bgm);
}
function playingCount(){ return players.filter(p => p.playing).length; }

function stageCleared(){
  state = 'clear'; clearT = 0;
  eshots.length = 0; beams.length = 0;
  // ボーナス
  for (const p of players){
    if (!p.playing || p.lives < 0) continue;
    p.stageBonus = p.lives*10000 + p.bombs*4000 + (stageIndex+1)*20000;
    p.score += p.stageBonus;
  }
  Bgm.play('ending');
}

function summonBoss(){
  bossSpawned = true;
  state = 'warning'; warnT = 0;
  enemies.length = 0;
  SFX.warn();
  Bgm.play(stageIndex === 4 ? 'last' : 'boss');
}

function updatePlay(){
  stageTime++;
  updateBG();

  // 予約スポーン
  for (let i=sched.length-1;i>=0;i--){
    if (sched[i].t <= stageTime){ sched[i].fn(); sched.splice(i,1); }
  }
  // ステージスクリプト
  const st = STAGES[stageIndex];
  while (scriptPtr < st.script.length && st.script[scriptPtr].t <= stageTime){
    st.script[scriptPtr].f(); scriptPtr++;
  }
  if (!bossSpawned && stageTime >= st.bossAt) summonBoss();

  updateEnemies();
  updateBoss();
  updateBeams();
  updateShots();
  updateItems();
  for (const p of players){ updatePlayer(p); playerHitCheck(p); }
  updateParticles();

  // ゲームオーバー判定
  const active = players.filter(p => p.playing);
  if (active.length > 0 && active.every(p => p.lives < 0)){
    const anyWait = active.some(p => p.outWait > 0);
    if (!anyWait){ state = 'gameover'; overT = 0; Bgm.stop(); }
  }
}

function updateShots(){
  // 自機弾
  for (let i=pshots.length-1;i>=0;i--){
    const s = pshots[i]; s.t++;
    if (s.type === 'm'){
      // ホーミングミサイル
      let tx=null, ty=null, bd=1e9;
      for (const e of enemies){ const d=hyp(e.x-s.x,e.y-s.y); if (d<bd){bd=d;tx=e.x;ty=e.y;} }
      if (boss && boss.state==='fight'){ const d=hyp(boss.x-s.x,boss.y-s.y); if (d<bd){bd=d;tx=boss.x;ty=boss.y;} }
      if (tx !== null && s.t < 90){
        const want = Math.atan2(ty-s.y, tx-s.x);
        const cur = Math.atan2(s.vy, s.vx);
        const na = cur + clamp(angDiff(cur,want), -0.14, 0.14);
        const sp = Math.min(12, hyp(s.vx,s.vy) + 0.25);
        s.vx = Math.cos(na)*sp; s.vy = Math.sin(na)*sp;
      } else {
        const sp = Math.min(13, hyp(s.vx,s.vy)+0.3);
        const a = Math.atan2(s.vy,s.vx);
        s.vx = Math.cos(a)*sp; s.vy = Math.sin(a)*sp;
      }
      if (s.t % 3 === 0) particles.push({x:s.x,y:s.y,vx:0,vy:1,life:10,max:10,col:s.owner.col,size:3,drag:0.9});
    }
    s.x += s.vx; s.y += s.vy;
    if (s.y < -30 || s.y > H+30 || s.x < -30 || s.x > W+30){ pshots.splice(i,1); continue; }

    let gone = false;
    // 敵に命中
    for (const e of enemies){
      if (e.dead) continue;
      if (hyp(e.x-s.x, e.y-s.y) < e.r + s.r){
        damageEnemy(e, s.dmg, s.owner);
        spark(s.x,s.y,2,'#fff',2,8,2);
        gone = true; break;
      }
    }
    if (!gone && boss && boss.state === 'fight'){
      const sat = satHitTest(s);
      if (sat){
        sat.st.hp -= s.dmg; sat.st.flash = 4;
        s.owner.score += Math.round(s.dmg*2);
        if (sat.st.hp <= 0){ sat.st.alive = false; boom(sat.sx, sat.sy, 1.6, '#ffcf5c'); SFX.big(); s.owner.score += 15000; }
        else SFX.hit();
        gone = true;
      } else if (bossHitTest(s)){
        damageBoss(s.dmg, s.owner, s.x, s.y);
        spark(s.x,s.y,2,'#fff',2,8,2);
        gone = true;
      }
    }
    if (gone) pshots.splice(i,1);
  }

  // 敵弾
  for (let i=eshots.length-1;i>=0;i--){
    const b = eshots[i]; b.t++;
    if (b.homing > 0 && b.t < b.homing){
      const p = nearestPlayer(b.x,b.y);
      if (p){
        const want = Math.atan2(p.y-b.y, p.x-b.x);
        const cur = Math.atan2(b.vy,b.vx);
        const na = cur + clamp(angDiff(cur,want), -0.035, 0.035);
        const sp = Math.min(4.6*bulSp, hyp(b.vx,b.vy) + 0.055);
        b.vx = Math.cos(na)*sp; b.vy = Math.sin(na)*sp;
      }
      if (b.t % 4 === 0) particles.push({x:b.x,y:b.y,vx:0,vy:0,life:12,max:12,col:'#ff9a5c',size:3,drag:0.9});
    }
    b.x += b.vx; b.y += b.vy;
    if (b.x < -40 || b.x > W+40 || b.y < -60 || b.y > H+40 || b.t > 1200) eshots.splice(i,1);
  }
}

function drawShots(){
  // --- 自機弾 ---
  for (const s of pshots){
    const x = Math.round(dot(s.x)), y = Math.round(dot(s.y));
    if (s.type === 'big'){
      rct(x-1, y-5, 2, 10, s.owner.col);
      rct(x-1, y-4, 2, 3, '#ffffff');
    } else if (s.type === 'm'){
      rct(x-1, y-2, 2, 4, s.owner.col); pset(x, y-2, '#ffffff');
    } else {
      rct(x, y-3, 1, 6, s.owner.col);
      pset(x, y-2, '#ffffff');
    }
  }
  // --- 敵弾（暗い縁取りをつけてどんな背景でも見えるように） ---
  const RIM = '#080c14';
  for (const b of eshots){
    const x = Math.round(dot(b.x)), y = Math.round(dot(b.y));
    if (b.type === 'needle'){
      const vert = Math.abs(b.vy) >= Math.abs(b.vx);
      if (vert){ rct(x-2, y-4, 4, 9, RIM); rct(x-1, y-3, 2, 7, b.col); }
      else     { rct(x-4, y-2, 9, 4, RIM); rct(x-3, y-1, 7, 2, b.col); }
      pset(x, y, '#ffffff'); pset(x-1, y, '#ffffff');
    } else if (b.type === 'missile'){
      rct(x-3, y-3, 6, 7, RIM); rct(x-2, y-2, 4, 5, b.col);
      rct(x-1, y-1, 2, 2, '#ffffff');
    } else {
      blit(ballSpr(b.col, b.core, b.r / PIXEL >= 2.1), x, y);
    }
  }
}

   12. HUD・各画面の描画（英数字はドットフォント／日本語はオーバーレイ）

const pad = (n,l) => String(Math.round(n)).padStart(l,'0');

function drawHUD(){
  rct(0, 0, PW, 17, '#050912');
  rct(0, 17, PW, 1, '#2c5a8c');

  drawSide(players[0], 2, 'left');
  drawSide(players[1], PW-2, 'right');
  dtext('ST ' + (stageIndex+1), PW/2, 1, '#cfe8ff', 'center', 1);
  dtext(STAGES[stageIndex].title, PW/2, 9, '#6f9ec4', 'center', 1);

  function drawSide(p, x, align){
    const over = (state === 'gameover');
    if (!p.playing){
      if (!over) dtext((p.id+1)+'P PUSH SHOT', x, 9, '#46647f', align, 1);
      return;
    }
    dtext((p.id+1)+'P', x, 1, p.col, align, 1);
    dtext(pad(p.score,8), align==='left' ? x+14 : x-14, 1, '#ffffff', align, 1);
    if (p.lives < 0){
      dtext((!over && Math.floor(gameFrame/50)%2) ? 'PUSH SHOT' : 'GAME OVER', x, 9, '#ff6a8a', align, 1);
    } else {
      dtext('L' + p.lives + ' B' + p.bombs + ' P' + p.power, x, 9, '#a8d8ff', align, 1);
    }
  }

  // ボスHPバー
  if (boss && (boss.state === 'fight' || boss.state === 'dying')){
    const k = clamp(boss.hp/boss.maxHp, 0, 1);
    rct(11, 20, PW-22, 5, '#100608');
    const w = Math.round((PW-24)*k);
    for (let i = 0; i < w; i++){
      const t = i/(PW-24);
      rct(12+i, 21, 1, 3, t < 0.4 ? '#ff2d55' : (t < 0.7 ? '#ff8a3b' : '#ffd83d'));
    }
    dtext(boss.title, PW/2, 27, '#ff9ab0', 'center', 1, '#1a0008');
  }

  // 自機まわりの表示
  for (const p of players){
    if (p.playing && p.msgT > 0 && p.alive)
      dtext(p.msg, dot(p.x), dot(p.y) - 16, p.col, 'center', 1, '#000a14');
    if (p.playing && p.lives < 0 && p.outWait > 0){
      const sec = Math.ceil(p.outWait/60);
      const x = playingCount() > 1 ? (p.id===0 ? PW*0.28 : PW*0.72) : PW/2;
      dtext((p.id+1)+'P CONTINUE?', x, PH*0.44, '#ffd83d', 'center', 1, '#000a14');
      dtext(String(sec), x, PH*0.44+12, sec<=3 ? '#ff4d6d' : '#ffffff', 'center', 2, '#000a14');
      dtext('PUSH SHOT', x, PH*0.44+30, '#a8d8ff', 'center', 1, '#000a14');
    }
  }
}

  for (const s of stars){ s.y += s.z*0.6; if (s.y>H){ s.y=-2; s.x=rand(0,W); } }
  const up = hit(['KeyW','ArrowUp'])    || Pad.navUp();
  const dn = hit(['KeyS','ArrowDown'])  || Pad.navDown();
  const lf = hit(['KeyA','ArrowLeft'])  || Pad.navLeft();
  const rt = hit(['KeyD','ArrowRight']) || Pad.navRight();
  const ok = hit(['Space','Enter','Numpad0','NumpadEnter']) || Pad.hit(PAD_SHOT) || Pad.hit(PAD_START);
  if (up){ menuSel = (menuSel+MENU_ROWS-1)%MENU_ROWS; SFX.menu(); }
  else if (dn){ menuSel = (menuSel+1)%MENU_ROWS; SFX.menu(); }
  else if (lf || rt){
    const d = rt ? 1 : -1;
    if (menuSel===0){ menuPlayers = menuPlayers===1?2:1; SFX.menu(); }
    else if (menuSel===1){ menuStage = (menuStage + d + 5)%5; SFX.menu(); }
    else if (menuSel===2){ menuSound = !menuSound; setSound(menuSound); SFX.menu(); }
  }
  if (ok){
    if (menuSel===3){ SFX.ok(); setSound(menuSound); resetRun(); }
    else if (menuSel===0){ menuPlayers = menuPlayers===1?2:1; SFX.menu(); }
    else if (menuSel===2){ menuSound = !menuSound; setSound(menuSound); SFX.menu(); }
    else SFX.menu();
  }
  Bgm.play('title');
}

function drawIntro(){
  const t = introT;
  if (t > 150) return;
  rct(0, PH/2-26, PW, 52, '#000a18cc');
  rct(0, PH/2-26, PW, 1, '#7fd8ff'); rct(0, PH/2+25, PW, 1, '#7fd8ff');
  dtext('STAGE ' + (stageIndex+1), PW/2, PH/2-18, '#ffd83d', 'center', 2, '#3a2a00');
  dtext(STAGES[stageIndex].title, PW/2, PH/2+10, '#e8f4ff', 'center', 1);
}

function drawWarning(){
  const t = warnT, blink = Math.floor(t/8)%2 === 0;
  const off = (t*2) % 12;
  for (let i=-1;i<PW/12+2;i++){
    ctx.fillStyle = '#4a0014';
    for (let yy = 0; yy < 40; yy++)
      ctx.fillRect(Math.round(i*12 + off - yy*0.4), PH/2-20+yy, 6, 1);
  }
  rct(0, PH/2-21, PW, 1, '#ff2d55'); rct(0, PH/2+20, PW, 1, '#ff2d55');
  if (blink) dtext('WARNING', PW/2, PH/2-14, '#ff3b6b', 'center', 2, '#200008');
  dtext('HUGE CONTACT APPROACHING', PW/2, PH/2+4, '#ffd83d', 'center', 1, '#200008');
  dtext(BOSSES[stageIndex].title, PW/2, PH/2+14, '#ffffff', 'center', 1, '#200008');
}

function drawClear(){
  const t = clearT;
  ctx.fillStyle = 'rgba(0,6,16,' + clamp(t/40,0,0.72) + ')'; ctx.fillRect(0,0,PW,PH);
  if (t < 12) return;
  dtext('STAGE ' + (stageIndex+1) + ' CLEAR', PW/2, 62, '#ffd83d', 'center', 2, '#3a2a00');
  let y = 100;
  for (const p of players){
    if (!p.playing || p.lives < 0) continue;
    dtext((p.id+1)+'P BONUS', PW/2-6, y, p.col, 'right', 1);
    if (t > 40) dtext(String(p.stageBonus||0), PW/2+6, y, '#ffffff', 'left', 1);
    y += 12;
    if (t > 70){ dtext('SCORE ' + pad(p.score,8), PW/2, y, '#bcd8f0', 'center', 1); y += 16; }
  }
  if (t > 110 && stageIndex + 1 < 5)
    dtext('NEXT STAGE IN ' + Math.ceil((190-t)/60), PW/2, 186, '#8fd8ff', 'center', 1);
}

function drawGameOver(){
  ctx.fillStyle = 'rgba(0,0,0,' + clamp(overT/50,0,0.85) + ')'; ctx.fillRect(0,0,PW,PH);
  dtext('GAME OVER', PW/2, 96, '#ff3b6b', 'center', 3, '#280008');
  let y = 132;
  for (const p of players){
    if (!p.playing) continue;
    dtext((p.id+1)+'P  ' + pad(p.score,8), PW/2, y, p.col, 'center', 1);
    y += 12;
  }
  dtext('REACHED ST' + (stageIndex+1) + '  ' + STAGES[stageIndex].title, PW/2, y+8, '#9fc4e8', 'center', 1);
  if (overT > 100 && Math.floor(gameFrame/30)%2 === 0)
    dtext('PRESS ANY KEY', PW/2, 196, '#cfe8ff', 'center', 1);
}

const ENDING_TEXT = [
  '', 'FORTRESS OMEGA DESTROYED', '',
  'THE LONG INVASION ENDS HERE.',
  'THE FORTRESS FALLS BEHIND YOU',
  'AS YOU TURN TO THE BLUE STAR.', '',
  'THERE IS STILL A HOME',
  'WAITING FOR YOU.', '', '',
];
function drawEnding(){
  ctx.fillStyle='#01030a'; ctx.fillRect(0,0,PW,PH);
  for (const st of stars) pset(dot(st.x), dot(st.y), st.z > 2.4 ? '#ffffff' : '#5f7fb8');

  const shipY = PH - 36 - Math.min(44, endT*0.05);
  for (const p of players){
    if (!p.playing) continue;
    const px = p.id===0 ? (playingCount()>1 ? PW/2-16 : PW/2) : PW/2+16;
    const fl = 2 + (Math.random()*3|0);
    for (let i=0;i<fl;i++){ rct(px-2, shipY+8+i, 1, 1, p.col); rct(px+1, shipY+8+i, 1, 1, p.col); }
    blit(p.id===0 ? SP.ship1 : SP.ship2, px, shipY);
  }

  const a = clamp((940 - endT)/70, 0, 1);
  if (a > 0){
    ctx.globalAlpha = a;
    const base = PH + 16 - endT*0.25;
    for (let i=0;i<ENDING_TEXT.length;i++){
      const y = base + i*13;
      if (y < -8 || y > PH+8) continue;
      dtext(ENDING_TEXT[i], PW/2, y, '#cfe8ff', 'center', 1);
    }
    ctx.globalAlpha = 1;
    if (endT*0.25 > PH - 150) dtext('- STELLAR ASSAULT -', PW/2, PH*0.35, '#ffd83d', 'center', 1);
  }
  if (endT > 900){
    rct(16, 68, PW-32, 84, '#000a10dd');
    dtext('ALL STAGE CLEAR', PW/2, 76, '#ffd83d', 'center', 1);
    dtext('FINAL SCORE', PW/2, 90, '#7fd8ff', 'center', 1);
    let y = 104;
    for (const p of players){
      if (!p.playing) continue;
      dtext((p.id+1)+'P  ' + pad(p.score,8), PW/2, y, p.col, 'center', 1); y += 12;
    }
    const rank = totalContinues===0 ? 'S' : (totalContinues<=3 ? 'A' : 'B');
    dtext('CONTINUE ' + totalContinues + '   RANK ' + rank, PW/2, y+2, '#ffffff', 'center', 1);
    if (endT > 1030 && Math.floor(gameFrame/30)%2 === 0)
      dtext('PRESS ANY KEY', PW/2, 172, '#cfe8ff', 'center', 1);
  }
}

/* ============================================================
   13. メインループ
   ============================================================ */
let last = performance.now(), acc = 0;
const STEP = 1000/60;

function frame(now){
  requestAnimationFrame(frame);
  let dt = now - last; last = now;
  if (dt > 250) dt = 250;
  acc += dt;
  let steps = 0;
  while (acc >= STEP && steps < 4){ update(); acc -= STEP; steps++; }
  if (acc > STEP*4) acc = 0;
  render();
}

function update(){
  gameFrame++;
  Pad.poll();
  if (sfxShotCd > 0) sfxShotCd--;
  Bgm.update();

  // 共通トグル
  if (hit(['KeyM'])){ menuSound = !menuSound; setSound(menuSound); }
  // Esc（パッドは SELECT／ホームボタン）でタイトルへ戻る
  if (state !== 'title' && (hit(['Escape']) || Pad.hit(PAD_HOME))){
    state = 'title'; menuSel = 3; paused = false;
    clearField(); Bgm.stop(); Bgm.play('title'); SFX.ok();
    edge.clear(); return;
  }
  if (state === 'play' || state === 'warning'){
    if (hit(['KeyP']) || Pad.hit(PAD_START)) paused = !paused;
  }

  if (paused){ edge.clear(); return; }

  switch (state){
    case 'title': updateTitle(); break;

    case 'intro':
      introT++;
      updateBG();
      updateShots(); updateItems(); updateParticles();
      for (const p of players) updatePlayer(p);
      if (introT > 160){ state = 'play'; }
      break;

    case 'play': updatePlay(); break;

    case 'warning':
      warnT++;
      updateBG();
      updateShots(); updateItems(); updateParticles();
      for (const p of players){ updatePlayer(p); playerHitCheck(p); }
      if (warnT === 60) SFX.warn();
      if (warnT > 150){
        boss = makeBoss(BOSSES[stageIndex]);
        state = 'play';
      }
      break;

    case 'clear':
      clearT++;
      updateBG(); updateShots(); updateItems(); updateParticles();
      for (const p of players) updatePlayer(p);
      if (clearT > 190){
        if (stageIndex + 1 < 5){ startStage(stageIndex+1); }
        else { state = 'ending'; endT = 0; players.forEach(q => q.bank = 0); Bgm.play('ending'); }
      }
      break;

    case 'gameover':
      overT++;
      updateParticles();
      if (overT > 100 && anyHit()){ state='title'; menuSel=3; Bgm.stop(); Bgm.play('title'); clearField(); }
      break;

    case 'ending':
      endT++;
      for (const s of stars){ s.y += s.z*1.4; if (s.y>H){ s.y=-2; s.x=rand(0,W); } }
      if (endT > 1030 && anyHit()){ state='title'; menuSel=3; clearField(); }
      break;
  }
  edge.clear();
  anyKeyThisFrame = false;
}

function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#000000'; ctx.fillRect(0,0,PW,PH);

  let sx = 0, sy = 0;
  if (shake > 0.4){ sx = Math.round(rand(-shake,shake)/PIXEL); sy = Math.round(rand(-shake,shake)/PIXEL); }
  ctx.save(); ctx.translate(sx, sy);

  if (state === 'title'){
    drawTitle();
  } else if (state === 'ending'){
    drawEnding();
  } else {
    drawBG(stageIndex);
    ctx.fillStyle = 'rgba(0,3,10,' + (STAGES[stageIndex].dim || 0) + ')';
    ctx.fillRect(0,0,PW,PH);
    drawItems();
    for (const e of enemies) e.k.draw(e);
    drawBoss();
    drawBeams();
    drawShots();
    for (const p of players) drawPlayer(p);
    drawParticles();
    drawHUD();
    if (state === 'intro')    drawIntro();
    if (state === 'warning')  drawWarning();
    if (state === 'clear')    drawClear();
    if (state === 'gameover') drawGameOver();
  }
  ctx.restore();

  if (flash > 0){
    ctx.globalAlpha = clamp(flash,0,1)*0.6;
    ctx.fillStyle = flashCol; ctx.fillRect(0,0,PW,PH);
    ctx.globalAlpha = 1;
  }
  if (paused){
    ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,PW,PH);
    dtext('PAUSE', PW/2, PH/2-14, '#ffd83d', 'center', 3, '#3a2a00');
    dtext('P:RESUME   ESC:TITLE', PW/2, PH/2+16, '#cfe8ff', 'center', 1);
  }
}

requestAnimationFrame(frame);

})();
</script>
